# Render Blueprint for Flow with Mind (2026-11-01). Render → New → Blueprint → pick BirdUTS/psychedelic-experience;
# Render reads this file and asks only for the value marked sync: false. The same chain as Story Stage
# (story.birdview.hk): stdlib Python server, secrets typed in the Render dashboard, one CNAME in the Wix DNS zone.
# Steps and what each setting does: docs/hosting.md
services:
  - type: web
    name: flow-with-mind
    runtime: python
    # free sleeps after 15 min idle and wakes in 20–60 s (22 s measured on story.birdview.hk); starter stays warm,
    # which matters when the first person to open the link is already mid-trip. Starter needs a card on the Render
    # account; until one is added this stays free (2026-11-01). Change the line and push: the Blueprint syncs it.
    plan: free
    buildCommand: 'echo "stdlib only, nothing to install"'
    startCommand: python scripts/serve_worlds.py --bind 0.0.0.0
    autoDeploy: true
    # A deploy takes the free instance down for a minute or two, so pushes that only touch notes or tests skip it.
    buildFilter:
      ignoredPaths:
        - docs/**
        - tests/**
        - "**/*.md"
        - scripts/test_*.py
        - .claude/**
    envVars:
      - key: ALLOWED_HOSTS
        value: flow.birdview.hk
      - key: COOKIE_SECURE
        value: "1"
      # No passcode by default (Bird, 2026-11-02): the address is enough. To put the door back, add FLOW_PASSCODE in
      # the dashboard (any value; the door asks for it, the link ?k=<value> carries it). An old FLOW_INVITE there is ignored.
      - key: TYPESAFE_API_KEY
        sync: false
