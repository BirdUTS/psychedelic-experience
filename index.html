<script>
'use strict';
const TAU=Math.PI*2;
const PENTATONIC=[0,2,4,7,9];
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ═══════════════════════════════════════════
// PHASE SYSTEM — auto-escalating experience
// ═══════════════════════════════════════════
// Phase 0 → 1 → 2 → 3, each unlocks more layers
// Timings: 0s, 30s, 90s, 180s
const PHASE_CONFIG=[
  {name:'Awakening',  t:0,   layers:{rd:false,attractor:false,geometry:true, lissajous:false,fourier:false,particles:true, tunnel:false}},
  {name:'Opening',    t:30,  layers:{rd:true, attractor:false,geometry:true, lissajous:true, fourier:false,particles:true, tunnel:true}},
  {name:'Expanding',  t:90,  layers:{rd:true, attractor:true, geometry:true, lissajous:true, fourier:true, particles:true, tunnel:true}},
  {name:'Dissolution',t:180, layers:{rd:true, attractor:true, geometry:true, lissajous:true, fourier:true, particles:true, tunnel:true}},
];

// ═══════════════════════════════════════════
// EXPERIENCE MODES  (Johns Hopkins MEQ + Klüver form constants)
// ═══════════════════════════════════════════
const MODES={
  mystic:       {hMin:220,hMax:300,sLo:.6, sHi:.85,lLo:.35,lHi:.6, bgH:260,bgL:7, rdF:.0545,rdK:.062, atA:1.4, atB:-2.3,atC:2.4, atD:-2.1, sym:12,spd:.7 },
  euphoric:     {hMin:0,  hMax:70, sLo:.8, sHi:1.0, lLo:.5, lHi:.7, bgH:25, bgL:9, rdF:.038, rdK:.099, atA:-1.7,atB:1.3, atC:-.1, atD:-1.21,sym:6, spd:1.2 },
  introspective:{hMin:185,hMax:240,sLo:.45,sHi:.75,lLo:.3, lHi:.55,bgH:215,bgL:6, rdF:.037, rdK:.065, atA:2.01,atB:-2.53,atC:1.61,atD:-.33, sym:8, spd:.55},
  geometric:    {hMin:90, hMax:180,sLo:.7, sHi:1.0, lLo:.4, lHi:.65,bgH:140,bgL:7, rdF:.042, rdK:.101, atA:-.8, atB:-1.1,atC:-.9, atD:.2,  sym:16,spd:1.0 },
  cathartic:    {hMin:-20,hMax:40, sLo:.75,sHi:1.0, lLo:.4, lHi:.65,bgH:10, bgL:8, rdF:.054, rdK:.063, atA:1.7, atB:1.7, atC:.6,  atD:1.2, sym:4, spd:1.05},
};
function selectMode([q1,q2,q3]){
  if(q1==='inner'&&q2==='slow'&&q3==='geometric')return 'mystic';
  if(q1==='inner'&&q2==='slow'&&q3==='organic')  return 'introspective';
  if(q1==='inner'&&q2==='fast'&&q3==='geometric')return 'geometric';
  if(q1==='inner'&&q2==='fast'&&q3==='organic')  return 'cathartic';
  if(q1==='outer'&&q2==='slow')return 'introspective';
  if(q1==='outer'&&q3==='geometric')return 'geometric';
  return 'euphoric';
}

// ═══════════════════════════════════════════
// BREATHING SYSTEM  (~12 BPM)
// ═══════════════════════════════════════════
class BreathingSystem{
  constructor(){this.phase=0;}
  update(dt){this.phase+=dt/5*TAU;}
  get value(){return .5+.5*Math.sin(this.phase);}
  get scale(){return .95+.1*this.value;}
}

// ═══════════════════════════════════════════
// TIME SYSTEM  (real clock → rich palette/speed/chaos modulation)
// ═══════════════════════════════════════════
class TimeSystem{
  constructor(){this.hueShift=0;this.speedMod=1;this.chaos=0;this.pulse=0;this.seed=0;this.minutePhase=0;this.secondWave=0;}
  update(){
    const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();
    // Hourly hue shift (warm day / cool night)
    this.hueShift=h>=6&&h<11?25:h>=11&&h<16?0:h>=16&&h<21?-15:-35;
    // Hourly speed (dreamy at night, lively by day)
    this.speedMod=h>=0&&h<6?.5:h>=12&&h<18?1.1:1.0;
    // Minute-level: slow sine modulates geometry drift & particle behavior
    this.minutePhase=(m+s/60)/60*TAU; // full cycle per hour
    // Second-level: micro-variation for "every moment is unique"
    this.secondWave=Math.sin((s+ms/1000)/60*TAU*5)*.5+.5; // ~5 waves per minute
    // Temporal seed: changes every 7 seconds, shuffles rare event timing
    this.seed=Math.floor((h*3600+m*60+s)/7);
    // Chaos: higher at "liminal" times (midnight, 3am, dusk)
    this.chaos=h>=0&&h<5?.6+.2*Math.sin(m/60*TAU):h>=17&&h<20?.3+.15*Math.sin(m/60*TAU):.1;
    // Pulse: a slow beat derived from real seconds (creates subtle rhythm)
    this.pulse=.5+.5*Math.sin((s+ms/1000)*TAU/5); // 5-second real-time breath
  }
}

// ═══════════════════════════════════════════
// COLOR SYSTEM
// ═══════════════════════════════════════════
class ColorSystem{
  constructor(){this.hueBase=Math.random()*360;this.m=MODES.mystic;}
  setMode(n){this.m=MODES[n]||MODES.mystic;}
  update(dt,ts){this.hueBase+=(dt*5*(this.m.spd||1)+(ts?ts.hueShift*.002+ts.secondWave*.3:0));if(this.hueBase>360)this.hueBase-=360;}
  hsl(off=0,alpha=1){
    const{hMin,hMax,sLo,sHi,lLo,lHi}=this.m;
    const s=((sLo+sHi)/2*100)|0,l=((lLo+lHi)/2*100)|0;
    const range=hMax-hMin;let h=this.hueBase+off;
    if(range<360)h=hMin+((h%range)+range)%range;
    h=((h%360)+360)%360;
    return `hsla(${h|0},${s}%,${l}%,${alpha})`;
  }
  hslValues(off=0){
    const{hMin,hMax,sLo,sHi,lLo,lHi}=this.m;
    const range=hMax-hMin;let h=this.hueBase+off;
    if(range<360)h=hMin+((h%range)+range)%range;
    h=((h%360)+360)%360;
    return{h,s:(sLo+sHi)/2,l:(lLo+lHi)/2};
  }
}

// ═══════════════════════════════════════════
// MICROPHONE SYSTEM  (FFT → bass/mid/treble)
// ═══════════════════════════════════════════
class MicrophoneSystem{
  constructor(){this.active=false;this.bass=0;this.mid=0;this.treble=0;this.volume=0;this.analyser=null;this.data=null;this.rawFFT=new Uint8Array(128);this.initError='';}
  async init(actx){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      this.analyser=actx.createAnalyser();this.analyser.fftSize=256;this.analyser.smoothingTimeConstant=.8;
      actx.createMediaStreamSource(stream).connect(this.analyser);
      this.data=new Uint8Array(this.analyser.frequencyBinCount);
      this.rawFFT=new Uint8Array(this.analyser.frequencyBinCount);
      this.active=true;
      document.getElementById('mic-btn').classList.add('active');
      document.getElementById('mic-btn').textContent='🎤 Microphone Active';
    }catch(e){this.active=false;this.initError=e.message||'Permission denied';}
  }
  update(){
    if(!this.active||!this.analyser)return;
    this.analyser.getByteFrequencyData(this.data);
    // Copy raw FFT for debug display
    this.rawFFT.set(this.data);
    const n=this.data.length;let b=0,m=0,tr=0,v=0;
    for(let i=0;i<n;i++){const x=this.data[i]/255;v+=x;if(i<n*.08)b+=x;else if(i<n*.5)m+=x;else tr+=x;}
    const S=.8;
    this.bass  =lerp(b/(n*.08),   this.bass,  S);
    this.mid   =lerp(m/(n*.42),   this.mid,   S);
    this.treble=lerp(tr/(n*.5),   this.treble,S);
    this.volume=lerp(v/n,         this.volume,S);
  }
  // Draw full-width audio debug bar at bottom of canvas
  drawDebug(ctx,W,H){
    const barH=55,y=H-barH;
    // Dark background strip
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,y,W,barH);
    // Divider line
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    // Status text
    ctx.font='bold 11px monospace';
    if(this.active){
      ctx.fillStyle='#00ff88';ctx.fillText('🎤 MIC ACTIVE',8,y+14);
    }else{
      ctx.fillStyle='#ff6644';ctx.fillText('⚠ MIC OFF — using simulated audio',8,y+14);
      if(this.initError){ctx.fillStyle='#ff4444';ctx.fillText('Error: '+this.initError,8,y+28);}
    }
    // Draw bass/mid/treble/volume values
    const vals=[
      {label:'BASS',v:this.bass,c:'#ff4466'},
      {label:'MID',v:this.mid,c:'#44ff88'},
      {label:'TREBLE',v:this.treble,c:'#4488ff'},
      {label:'VOL',v:this.volume,c:'#ffcc44'}
    ];
    const vx=W*.45;
    ctx.font='9px monospace';
    vals.forEach((d,i)=>{
      const x=vx+i*80,bw=50,bh=10,by=y+8;
      // Label
      ctx.fillStyle=d.c;ctx.fillText(d.label+' '+d.v.toFixed(2),x,by);
      // Bar bg
      ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x,by+3,bw,bh);
      // Bar fill
      ctx.fillStyle=d.c;ctx.fillRect(x,by+3,bw*Math.min(1,d.v),bh);
    });
    // FFT frequency bars (full width)
    const fftY=y+26,fftH=barH-28,n=this.active?this.rawFFT.length:64;
    const barW=W/n;
    for(let i=0;i<n;i++){
      let val;
      if(this.active){
        val=this.rawFFT[i]/255;
      }else{
        // Show simulated values as bars too
        const t=performance.now()/1000;
        val=i<n*.08?this.bass*.8+.1*Math.sin(t*3+i):i<n*.5?this.mid*.6+.1*Math.sin(t*2+i*.3):this.treble*.5+.08*Math.sin(t*4+i*.5);
        val=Math.max(0,Math.min(1,val));
      }
      const h=val*fftH;
      if(h<.5)continue;
      // Color: red for bass, green for mid, blue for treble
      const ratio=i/n;
      const r=ratio<.08?255:ratio<.5?Math.floor(70*(1-ratio)):70;
      const g=ratio<.08?70:ratio<.5?255:Math.floor(140*(1-ratio));
      const b=ratio<.5?100:255;
      ctx.fillStyle=`rgba(${r},${g},${b},${.5+val*.4})`;
      ctx.fillRect(i*barW,fftY+fftH-h,Math.max(1,barW-.5),h);
    }
  }
  fallback(t){
    // Richer synthetic audio: multiple overlapping waves + occasional bass "hits"
    const hit=Math.max(0,Math.sin(t*1.3)-.7)*3;// periodic bass spike
    this.bass=.3+.2*Math.sin(t*.7)+.1*Math.sin(t*.23+3)+hit*.15;
    this.mid=.25+.15*Math.sin(t*1.1+1)+.08*Math.sin(t*.37+2);
    this.treble=.15+.1*Math.sin(t*1.9+2)+.06*Math.sin(t*2.7);
    this.volume=.25+.15*Math.sin(t*.5)+hit*.1;
  }
}

// ═══════════════════════════════════════════
// PARTICLE POOL  (typed arrays)
// ═══════════════════════════════════════════
class ParticlePool{
  constructor(max){
    this.max=max;this.count=0;
    this.x=new Float32Array(max);this.y=new Float32Array(max);
    this.vx=new Float32Array(max);this.vy=new Float32Array(max);
    this.life=new Float32Array(max);this.ml=new Float32Array(max);
    this.size=new Float32Array(max);this.hue=new Float32Array(max);
    this.type=new Uint8Array(max);
  }
  spawn(x,y,vx,vy,life,size,hue,type){
    let i;
    if(this.count<this.max){i=this.count++;}
    else{let mn=Infinity,mi=0;for(let j=0;j<this.max;j++)if(this.life[j]<mn){mn=this.life[j];mi=j;}i=mi;}
    this.x[i]=x;this.y[i]=y;this.vx[i]=vx;this.vy[i]=vy;
    this.life[i]=life;this.ml[i]=life;this.size[i]=size;this.hue[i]=hue;this.type[i]=type;
  }
  update(dt,mx,my){
    for(let i=this.count-1;i>=0;i--){
      this.life[i]-=dt;
      if(this.life[i]<=0){
        this.count--;
        if(i<this.count){this.x[i]=this.x[this.count];this.y[i]=this.y[this.count];this.vx[i]=this.vx[this.count];this.vy[i]=this.vy[this.count];this.life[i]=this.life[this.count];this.ml[i]=this.ml[this.count];this.size[i]=this.size[this.count];this.hue[i]=this.hue[this.count];this.type[i]=this.type[this.count];}
        continue;
      }
      const tp=this.type[i];
      if(tp===0||tp===4){const dx=mx-this.x[i],dy=my-this.y[i],dsq=dx*dx+dy*dy+1,f=Math.min(50/dsq,.5);this.vx[i]+=dx*f*dt*60;this.vy[i]+=dy*f*dt*60;}
      const fr=tp===0?.999:tp===4?.998:.97;
      this.vx[i]*=fr;this.vy[i]*=fr;this.x[i]+=this.vx[i]*dt*60;this.y[i]+=this.vy[i]*dt*60;
    }
  }
  draw(ctx){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<this.count;i++){
      const a=clamp(this.life[i]/this.ml[i]*2,0,1);if(a<.01)continue;
      const s=this.size[i]*(.5+.5*(this.life[i]/this.ml[i])),h=this.hue[i],gr=s*3,x=this.x[i],y=this.y[i];
      const g=ctx.createRadialGradient(x,y,0,x,y,gr);
      g.addColorStop(0,`hsla(${h|0},85%,70%,${(a*.9).toFixed(2)})`);
      g.addColorStop(.4,`hsla(${h|0},80%,60%,${(a*.35).toFixed(2)})`);
      g.addColorStop(1,`hsla(${h|0},80%,50%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,gr,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// RIPPLE SYSTEM
// ═══════════════════════════════════════════
class RippleSystem{
  constructor(){this.r=[];}
  spawn(x,y,hue){if(this.r.length>=20)this.r.shift();this.r.push({x,y,r:0,a:.6,hue,maxR:150+Math.random()*100});}
  update(dt){for(let i=this.r.length-1;i>=0;i--){const r=this.r[i];r.r+=dt*120;r.a=.6*(1-r.r/r.maxR);if(r.a<=.01)this.r.splice(i,1);}}
  draw(ctx){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(const r of this.r){ctx.strokeStyle=`hsla(${r.hue|0},80%,65%,${r.a.toFixed(2)})`;ctx.lineWidth=Math.max(1,3*(1-r.r/r.maxR));ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// TRAIL SYSTEM  (ring buffer)
// ═══════════════════════════════════════════
class TrailSystem{
  constructor(len){this.len=len;this.pts=Array.from({length:len},()=>({x:0,y:0,age:999}));this.head=0;this.active=false;}
  push(x,y){this.pts[this.head]={x,y,age:0};this.head=(this.head+1)%this.len;this.active=true;}
  update(dt){for(let i=0;i<this.len;i++)this.pts[i].age+=dt;}
  draw(ctx,colors){
    if(!this.active)return;
    const live=[];for(let i=0;i<this.len;i++){const p=this.pts[(this.head+i)%this.len];if(p.age<2)live.push(p);}
    if(live.length<3)return;
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=1;i<live.length-1;i++){
      const p=live[i],t=1-p.age/2;if(t<=0)continue;
      ctx.strokeStyle=colors.hsl(t*60,t*t*.8);ctx.lineWidth=t*5+1;ctx.lineCap='round';
      const pv=live[i-1],nx=live[i+1];
      ctx.beginPath();ctx.moveTo((pv.x+p.x)/2,(pv.y+p.y)/2);ctx.quadraticCurveTo(p.x,p.y,(p.x+nx.x)/2,(p.y+nx.y)/2);ctx.stroke();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// REACTION-DIFFUSION  (Gray-Scott, 128×128)
// ═══════════════════════════════════════════
class ReactionDiffusion{
  constructor(){
    this.W=128;this.H=128;this.N=this.W*this.H;
    this.u=new Float32Array(this.N).fill(1);this.v=new Float32Array(this.N);
    this.nu=new Float32Array(this.N);this.nv=new Float32Array(this.N);
    this.f=.0545;this.k=.062;this.fc=0;
    this.offC=document.createElement('canvas');this.offC.width=this.W;this.offC.height=this.H;
    this.offCtx=this.offC.getContext('2d');
    this.imgData=this.offCtx.createImageData(this.W,this.H);
    this._seed();
  }
  _seed(){
    const cx=this.W>>1,cy=this.H>>1;
    [[cx,cy,6],[cx-20,cy-20,4],[cx+20,cy+15,4],[cx-15,cy+20,4]].forEach(([sx,sy,r])=>{
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy<=r*r){const i=(sy+dy)*this.W+(sx+dx);if(i>=0&&i<this.N){this.u[i]=.5;this.v[i]=.25;}}}
    });
  }
  setMode(n){const p={mystic:{f:.0545,k:.062},euphoric:{f:.038,k:.099},introspective:{f:.037,k:.065},geometric:{f:.042,k:.101},cathartic:{f:.054,k:.063}};const m=p[n]||p.mystic;this.f=m.f;this.k=m.k;this.u.fill(1);this.v.fill(0);this._seed();}
  _step(){
    const{W,H,u,v,nu,nv,f,k}=this;
    for(let y=1;y<H-1;y++){for(let x=1;x<W-1;x++){
      const i=y*W+x,lu=u[i-1]+u[i+1]+u[i-W]+u[i+W]-4*u[i],lv=v[i-1]+v[i+1]+v[i-W]+v[i+W]-4*v[i],uvv=u[i]*v[i]*v[i];
      nu[i]=clamp(u[i]+lu*.25-uvv+f*(1-u[i]),0,1);
      nv[i]=clamp(v[i]+lv*.125+uvv-(f+k)*v[i],0,1);
    }}
    for(let i=0;i<this.N;i++){this.u[i]=this.nu[i];this.v[i]=this.nv[i];}
  }

// ═══════════════════════════════════════════
// STRANGE ATTRACTOR  (De Jong, persistent canvas)
// ═══════════════════════════════════════════
class StrangeAttractor{
  constructor(){
    this.a=1.4;this.b=-2.3;this.c=2.4;this.d=-2.1;
    this.ta=this.a;this.tb=this.b;this.tc=this.c;this.td=this.d;
    this.x=.1;this.y=.1;this.mt=0;
    this.offC=document.createElement('canvas');this.offCtx=this.offC.getContext('2d');
  }
  setMode(n){const p={mystic:{a:1.4,b:-2.3,c:2.4,d:-2.1},euphoric:{a:-1.7,b:1.3,c:-.1,d:-1.21},introspective:{a:2.01,b:-2.53,c:1.61,d:-.33},geometric:{a:-.8,b:-1.1,c:-.9,d:.2},cathartic:{a:1.7,b:1.7,c:.6,d:1.2}};const m=p[n]||p.mystic;this.ta=m.a;this.tb=m.b;this.tc=m.c;this.td=m.d;}

    this.mt+=dt;
    if(this.mt>12){this.mt=0;this.ta=clamp(this.ta+(Math.random()-.5)*.4,-3,3);this.tb=clamp(this.tb+(Math.random()-.5)*.4,-3,3);this.tc=clamp(this.tc+(Math.random()-.5)*.4,-3,3);this.td=clamp(this.td+(Math.random()-.5)*.4,-3,3);}
    const s=dt*.2;this.a=lerp(this.a,this.ta,s);this.b=lerp(this.b,this.tb,s);this.c=lerp(this.c,this.tc,s);this.d=lerp(this.d,this.td,s);
  }
  draw(ctx,W,H,colors,audio){
    if(this.offC.width!==W||this.offC.height!==H){this.offC.width=W;this.offC.height=H;}

    oc.fillStyle='rgba(0,0,0,0.025)';oc.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,sc=Math.min(W,H)*.22,{h}=colors.hslValues();

    for(let i=0;i<N;i++){

  }
}

// ═══════════════════════════════════════════
// LISSAJOUS  (audio-reactive parametric curves)
// ═══════════════════════════════════════════
class LissajousSystem{
  constructor(){this.fA=3;this.fB=2;this.phase=0;}
  update(dt,audio){this.phase+=dt*.25;this.fA=lerp(this.fA,2+(audio.mid*4|0),dt*.4);this.fB=lerp(this.fB,1+(audio.bass*3|0),dt*.4);}
  draw(ctx,cx,cy,size,colors,audio){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.lineWidth=1.2;ctx.beginPath();
    for(let i=0;i<=512;i++){const t=(i/512)*TAU,x=cx+Math.sin(this.fA*t+this.phase)*size,y=cy+Math.sin(this.fB*t)*size;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle=colors.hsl(-40,.3+audio.volume*.25);ctx.stroke();ctx.restore();
  }
}

// ═══════════════════════════════════════════
// FOURIER MANDALA  (epicycle sum, N-fold symmetric)
// ═══════════════════════════════════════════
class FourierMandala{
  constructor(){this.t=0;this.sym=6;}
  setSym(n){this.sym=n;}
  update(dt){this.t+=dt*.15;}
  draw(ctx,cx,cy,size,colors,audio){
    const N=this.sym,freqs=[N,N*2,N*3,N*4,N*5,N*6];
    const bAmps=[.48,.22,.13,.08,.05,.03];
    const mods=[1+audio.bass*.6,1+audio.mid*.4,1+audio.treble*.3,1+audio.bass*.2,1+audio.mid*.15,1+audio.treble*.1];
    const steps=N*24;
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let pass=0;pass<2;pass++){
      ctx.beginPath();
      for(let s=0;s<=steps;s++){
        const t=(s/steps)*TAU;let x=0,y=0;
        for(let i=0;i<freqs.length;i++){const amp=size*bAmps[i]*mods[i],ph=this.t*(i*.12+.04);x+=Math.cos(freqs[i]*t+ph)*amp;y+=Math.sin(freqs[i]*t+ph)*amp;}
        s===0?ctx.moveTo(cx+x,cy+y):ctx.lineTo(cx+x,cy+y);
      }
      ctx.closePath();
      ctx.strokeStyle=colors.hsl(pass===0?80:160,pass===0?.55+audio.volume*.2:.3+audio.bass*.15);
      ctx.lineWidth=pass===0?1.5:.6;ctx.stroke();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// GEOMETRY ENGINE  (4 sacred patterns)
// ═══════════════════════════════════════════
class GeometryEngine{
  constructor(){this.pats=['flowerOfLife','metatronsCube','sriYantra','mandala'];this.cur=0;this.nxt=1;this.tp=1;this.tt=0;this.td=35+Math.random()*25;this.rot=0;this.ps=1;this.pv=0;this.cx=0;this.cy=0;}

    this.pv*=.92;this.ps+=this.pv*dt;this.ps+=(1-this.ps)*dt*3;

    if(this.tp<1){this.tp+=dt*.25;if(this.tp>=1){this.tp=1;this.cur=this.nxt;}}

  }
  _dp(ctx,name,sz,co,br){

    else this._mandala(ctx,sz,co,br);
  }
  _fol(ctx,sz,co,br){
    const r=sz*.25,cs=[{x:0,y:0}];

    for(let i=0;i<6;i++){const a=(i+.5)*TAU/6+br.phase*.03;ns.push({x:Math.cos(a)*r2,y:Math.sin(a)*r2});}

  }
  _sy(ctx,sz,co,br){

      ctx.strokeStyle=co.hsl(l*50,al*.5);ctx.lineWidth=.8;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════
// SPIRIT LIGHTS  (idle orbs)

class SpiritLights{
  constructor(){this.lights=[];this.active=false;}
  spawn(W,H,hue){if(this.lights.length>=5)return;const e=Math.random()<.5?-50:W+50;this.lights.push({x:e,y:Math.random()*H,vx:(e<0?1:-1)*(20+Math.random()*30),vy:0,phase:Math.random()*TAU,size:8+Math.random()*12,hue,life:15,maxLife:15,fading:false});this.active=true;}

// ═══════════════════════════════════════════
// TUNNEL EFFECT  (zoom-in wormhole)
// ═══════════════════════════════════════════
class TunnelEffect{
  constructor(){
    this.rings=[];this.active=false;this.intensity=0;this.targetIntensity=0;
    this.eventTimer=0;this.eventInterval=25+Math.random()*20;// first trigger 25-45s in
    this.eventDuration=0;this.maxDuration=8;
    this.rotation=0;this.shapePhase=0;// morphs between circle/hex/star
    this.holdBoost=0;// extra speed from mouse hold
  }
  trigger(duration){
    if(this.active&&this.intensity>.5)return;// don't re-trigger mid-tunnel
    this.active=true;this.targetIntensity=1;this.eventDuration=duration||6+Math.random()*6;
  }
  stop(){this.targetIntensity=0;}
  update(dt,audio,breath,timeSys){
    // Auto-trigger at random intervals
    if(!this.active){
      this.eventTimer+=dt;
      if(this.eventTimer>=this.eventInterval){
        this.trigger();
        this.eventTimer=0;
        this.eventInterval=20+Math.random()*25+timeSys.chaos*15;// chaos → more frequent
      }
    }
    // Intensity ramp
    if(this.active){
      this.intensity=lerp(this.intensity,this.targetIntensity,dt*1.5);
      this.eventDuration-=dt;
      if(this.eventDuration<=0){this.stop();this.eventDuration=0;}
      if(this.targetIntensity===0&&this.intensity<.02){this.active=false;this.intensity=0;}
    }
    this.holdBoost*=.9;
    // Spawn rings based on intensity
    const spawnRate=6+audio.bass*8+this.holdBoost*10;// rings per second
    const spawnCount=Math.max(0,Math.floor(this.intensity*spawnRate*dt+Math.random()*.5));
    for(let i=0;i<spawnCount;i++){
      this.rings.push({
        r:2+Math.random()*8, // start small at center
        speed:80+Math.random()*120+audio.bass*100+this.holdBoost*80,
        hueOff:Math.random()*40-20,
        alpha:.6+Math.random()*.3,
        sides:Math.random()<.3?6:Math.random()<.15?5:0, // 0=circle, 5=star, 6=hex
        rot:Math.random()*TAU,
        width:1+Math.random()*1.5+audio.treble*2
      });
    }
    // Update rings — expand outward
    const speedMul=1+breath.value*.3+timeSys.secondWave*.2;
    for(let i=this.rings.length-1;i>=0;i--){
      const ring=this.rings[i];
      ring.r+=ring.speed*speedMul*dt;
      ring.alpha-=dt*.15;// fade as they expand
      ring.rot+=dt*.1*(ring.sides===5?-1:1);
      if(ring.alpha<=0||ring.r>2000)this.rings.splice(i,1);
    }
    // Global rotation
    this.rotation+=dt*.08*(1+audio.mid*.5);
    this.shapePhase+=dt*.15;
    // Cap ring count for performance
    if(this.rings.length>120)this.rings.splice(0,this.rings.length-120);
  }
  draw(ctx,W,H,colors,audio){
    if(!this.active&&this.rings.length===0)return;
    const cx=W/2,cy=H/2,maxR=Math.sqrt(W*W+H*H)/2;
    ctx.save();ctx.globalCompositeOperation='screen';
    ctx.translate(cx,cy);ctx.rotate(this.rotation);
    for(const ring of this.rings){
      const normR=ring.r/maxR;
      const a=ring.alpha*this.intensity*(1-normR*.5);
      if(a<.01)continue;
      const hue=colors.hslValues(ring.hueOff).h;
      ctx.strokeStyle=`hsla(${hue|0},70%,65%,${a.toFixed(3)})`;
      ctx.lineWidth=ring.width*(1+normR*.5);
      ctx.beginPath();
      if(ring.sides===0){
        // Circle
        ctx.arc(0,0,Math.max(1,ring.r),0,TAU);
      }else{
        // Polygon (hex or pentagram/star)
        const n=ring.sides,isStar=n===5;
        for(let j=0;j<=n;j++){
          const angle=ring.rot+j/n*TAU;
          const rr=isStar?(j%2===0?ring.r:ring.r*.45):ring.r;
          const px=Math.cos(angle)*Math.max(1,rr),py=Math.sin(angle)*Math.max(1,rr);
          j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }
        ctx.closePath();
      }
      ctx.stroke();
      // Inner glow on fresh rings
      if(ring.r<60&&a>.2){
        const g=ctx.createRadialGradient(0,0,Math.max(1,ring.r*.5),0,0,Math.max(2,ring.r*1.2));
        g.addColorStop(0,`hsla(${hue|0},80%,75%,${(a*.3).toFixed(3)})`);
        g.addColorStop(1,'hsla(0,0%,0%,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,Math.max(2,ring.r*1.2),0,TAU);ctx.fill();
      }
    }
    ctx.restore();
  }
  boostFromHold(){this.holdBoost=1;}
}

// ═══════════════════════════════════════════
// SOUND ENGINE
// ═══════════════════════════════════════════
class SoundEngine{
  constructor(){this.ctx=null;this.ok=false;this.droneOscs=[];this.droneGain=null;this.droneFilter=null;this.moveOsc=null;this.moveGain=null;this.holdOsc=null;this.holdGain=null;this.reverb=null;this.master=null;}

    this.holdOsc=this.ctx.createOscillator();this.holdOsc.type='sine';this.holdOsc.frequency.value=220;this.holdOsc.connect(this.holdGain);this.holdOsc.start();
  }
  _mkRev(dur){const r=this.ctx.sampleRate,len=r*dur,buf=this.ctx.createBuffer(2,len,r);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}const cv=this.ctx.createConvolver();cv.buffer=buf;return cv;}
  _q(freq){const C4=261.63,st=12*Math.log2(freq/C4),oct=Math.floor(st/12);let rem=((st%12)+12)%12,mn=99,sn=0;for(const d of PENTATONIC){const dd=Math.min(Math.abs(rem-d),12-Math.abs(rem-d));if(dd<mn){mn=dd;sn=d;}}return C4*Math.pow(2,(oct*12+sn)/12);}

  fadeMove(){if(this.ok)this._set(this.moveGain.gain,0,.3);}
  triggerClick(nx,ny){

    [1,1.5,2,2.52].forEach((h,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=base*h;g.gain.setValueAtTime([.15,.1,.08,.04][i],now);g.gain.exponentialRampToValueAtTime(.001,now+2);o.connect(g);g.connect(this.reverb);o.start(now);o.stop(now+2);});
    const bs=this.ctx.sampleRate*.2,nb=this.ctx.createBuffer(1,bs,this.ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<bs;i++)nd[i]=Math.random()*2-1;

  startHold(){if(this.ok)this._set(this.holdGain.gain,.08,.3);}
  updateHold(dur){if(this.ok)this._set(this.holdOsc.frequency,this._q(220+Math.min(dur*30,440)),.1);}
  releaseHold(){if(this.ok)this._set(this.holdGain.gain,0,.5);}

}

// ═══════════════════════════════════════════
// ONBOARDING  (3 animated visual questions)
// ═══════════════════════════════════════════
class OnboardingSystem{
  constructor(){this.phase='question';this.qi=0;this.answers=[];this.hover=null;this.selected=null;this.selTimer=0;this.selecting=false;this.portalT=0;}
  _side(mx,my,W,H){const bY=H*.2,bH=H*.6,lX=W*.06,rX=W*.52,bW=W*.42;if(my<bY||my>bY+bH)return null;if(mx>=lX&&mx<=lX+bW)return 'left';if(mx>=rX&&mx<=rX+bW)return 'right';return null;}
  click(mx,my,W,H){
    if(this.selecting||this.phase!=='question')return;
    const s=this._side(mx,my,W,H);if(!s)return;
    this.selected=s;this.selecting=true;this.selTimer=0;
    const opts=[['inner','outer'],['slow','fast'],['geometric','organic']];
    this.answers.push(s==='left'?opts[this.qi][0]:opts[this.qi][1]);
  }
  update(dt,mx,my,W,H){
    if(this.phase==='question'){
      this.hover=this._side(mx,my,W,H);
      if(this.selecting){this.selTimer+=dt;if(this.selTimer>1.0){this.selecting=false;this.qi++;this.selected=null;if(this.qi>=3){this.phase='portal';this.portalT=0;}}}
    }else if(this.phase==='portal'){this.portalT+=dt;if(this.portalT>2.2)this.phase='done';}
  }
  draw(ctx,W,H,t,co){
    if(this.phase==='done')return;
    if(this.phase==='portal'){this._portal(ctx,W,H,this.portalT/2.2,co);return;}
    // Question dots
    for(let i=0;i<3;i++){const dx=W/2+(i-1)*24,dy=H*.88;ctx.beginPath();ctx.arc(dx,dy,4,0,TAU);ctx.fillStyle=i<this.qi?'rgba(160,100,220,.9)':i===this.qi?'rgba(160,100,220,.45)':'rgba(80,50,110,.3)';ctx.fill();}
    const bY=H*.2,bH=H*.6,lX=W*.06,rX=W*.52,bW=W*.42,brad=14;
    ['left','right'].forEach(side=>{
      const x=side==='left'?lX:rX,isHov=this.hover===side,isSel=this.selected===side,isDe=this.selected&&this.selected!==side;
      const pAlpha=isDe?Math.max(0,1-this.selTimer*2):1;
      const scale=isSel?1+this.selTimer*.6:isHov?1.025:1;
      ctx.save();ctx.globalAlpha=pAlpha;
      ctx.translate(x+bW/2,bY+bH/2);ctx.scale(scale,scale);ctx.translate(-(x+bW/2),-(bY+bH/2));
      ctx.beginPath();ctx.roundRect(x,bY,bW,bH,brad);ctx.clip();
      this._opt(ctx,side,this.qi,x,bY,bW,bH,t,co);
      ctx.strokeStyle=isHov||isSel?'rgba(200,160,255,.7)':'rgba(120,80,160,.25)';ctx.lineWidth=isHov?2:1;
      ctx.beginPath();ctx.roundRect(x,bY,bW,bH,brad);ctx.stroke();
      ctx.restore();
    });
  }
  _opt(ctx,side,qi,x,y,w,h,t,co){
    const cx=x+w/2,cy=y+h/2;
    if(qi===0){
      if(side==='left'){
        // Inner — converging vortex
        ctx.fillStyle='rgba(3,0,15,1)';ctx.fillRect(x,y,w,h);
        for(let i=0;i<80;i++){const a=(i/80)*TAU+t*.4,r=(h*.38)*(1-(t*.25+i*.005)%1),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r,al=.2+.25*Math.sin(t+i*.15);ctx.fillStyle=`hsla(${250+i*.4},70%,60%,${al})`;ctx.beginPath();ctx.arc(px,py,1.5,0,TAU);ctx.fill();}
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,h*.2);g.addColorStop(0,'rgba(100,40,180,.5)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,h*.2,0,TAU);ctx.fill();
      }else{
        // Outer — expanding bloom
        ctx.fillStyle='rgba(15,5,0,1)';ctx.fillRect(x,y,w,h);
        for(let ring=0;ring<4;ring++){const r=((t*40*(ring+1))%(h*.55)),al=.5*(1-r/(h*.55));if(al>.01){ctx.strokeStyle=`hsla(${30+ring*12},85%,62%,${al})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();}}
        for(let i=0;i<6;i++){const a=i*TAU/6+t*.2,g=ctx.createRadialGradient(cx+Math.cos(a)*h*.25,cy+Math.sin(a)*h*.25,0,cx+Math.cos(a)*h*.25,cy+Math.sin(a)*h*.25,h*.16);g.addColorStop(0,`hsla(${35+i*8},90%,65%,.28)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx+Math.cos(a)*h*.25,cy+Math.sin(a)*h*.25,h*.16,0,TAU);ctx.fill();}
      }
    }else if(qi===1){
      if(side==='left'){
        // Slow — deep ocean waves
        ctx.fillStyle='rgba(0,4,18,1)';ctx.fillRect(x,y,w,h);
        for(let wv=0;wv<9;wv++){const wy=y+h*(.1+wv*.09),amp=h*.025,ph=t*.35+wv*.55;ctx.beginPath();ctx.moveTo(x,wy);for(let px=x;px<=x+w;px+=3)ctx.lineTo(px,wy+Math.sin((px-x)/w*TAU*2+ph)*amp);ctx.strokeStyle=`hsla(${200+wv*4},65%,55%,${.1+.08*Math.sin(t+wv*.4)})`;ctx.lineWidth=1;ctx.stroke();}
      }else{
        // Fast — neural sparks
        ctx.fillStyle='rgba(0,0,12,1)';ctx.fillRect(x,y,w,h);
        const nodes=[];for(let i=0;i<10;i++)nodes.push({x:x+w*(.1+.8*((Math.sin(t*.8+i*1.4)+1)/2)),y:y+h*(.1+.8*((Math.cos(t*.6+i*1.8)+1)/2))});
        for(let i=0;i<nodes.length;i++){const fl=Math.max(0,Math.sin(t*3.5+i*.9));if(fl>.45){ctx.fillStyle=`rgba(140,210,255,${fl*.9})`;ctx.beginPath();ctx.arc(nodes[i].x,nodes[i].y,3,0,TAU);ctx.fill();}for(let j=i+1;j<nodes.length;j++){const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y;if(dx*dx+dy*dy<(w*.5)**2){const fl2=Math.max(0,Math.sin(t*4+i*.6+j*.4));if(fl2>.55){ctx.strokeStyle=`rgba(90,190,255,${fl2*.35})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();}}}}
      }
    }else{
      if(side==='left'){
        // Geometric — rotating hexagons
        ctx.fillStyle='rgba(0,4,14,1)';ctx.fillRect(x,y,w,h);
        ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.18);
        for(let ring=0;ring<5;ring++){const r=ring*h*.1+12;ctx.beginPath();for(let i=0;i<=6;i++){const a=i*TAU/6;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.strokeStyle=`hsla(${190+ring*20},70%,60%,${.25+.15*Math.sin(t+ring)})`;ctx.lineWidth=1;ctx.stroke();}
        ctx.restore();
      }else{
        // Organic — bubbling circles
        ctx.fillStyle='rgba(0,10,10,1)';ctx.fillRect(x,y,w,h);
        for(let i=0;i<10;i++){const bx=x+w*(.1+.8*((Math.sin(t*.35+i*1.2)+1)/2)),by=y+h*(.1+.8*((Math.cos(t*.45+i*.95)+1)/2)),r=Math.max(2,h*(.06+.06*Math.sin(t*.5+i*.75))),al=Math.max(0,.12+.12*Math.sin(t*.6+i*.4)),g=ctx.createRadialGradient(bx,by,0,bx,by,r*1.6);g.addColorStop(0,`hsla(${145+i*10},65%,60%,${al*2.5})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,r*1.6,0,TAU);ctx.fill();}
      }
    }
  }
  _portal(ctx,W,H,p,co){
    ctx.fillStyle=`rgba(0,0,0,${.04+p*.06})`;ctx.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,maxR=Math.sqrt(W*W+H*H)/2,{h}=co.hslValues();
    for(let i=0;i<250;i++){const angle=(i/250)*TAU*10-this.portalT*5,r=maxR*(1-p*.85)*(i/250),px=cx+Math.cos(angle)*r,py=cy+Math.sin(angle)*r,al=.4*(1-i/250)*p,hue=(h+(i/250)*90)%360;ctx.fillStyle=`hsla(${hue|0},70%,65%,${al})`;ctx.beginPath();ctx.arc(px,py,1.8,0,TAU);ctx.fill();}
  }
  get isDone(){return this.phase==='done';}
}

// ═══════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════
class App{
  constructor(){
    this.canvas=document.getElementById('c');this.ctx=this.canvas.getContext('2d');
    this.entry=document.getElementById('entry');this.hud=document.getElementById('hud');
    this.phaseLabel=document.getElementById('phase-label');
    this.started=false;this.time=0;this.lastTime=0;this.W=0;this.H=0;
    // Input
    this.mx=0;this.my=0;this.pmx=0;this.pmy=0;this.vel=0;
    this.down=false;this.holdDur=0;this.idleTime=0;this.lastRipple=0;this.flashA=0;
    // Mode & Phase
    this.modeName='mystic';this.phase=0;this.phaseTimer=0;this.nextPhaseT=PHASE_CONFIG[1].t;
    // Layer toggles — start from Phase 0 defaults
    this.layers={rd:false,attractor:false,geometry:true,lissajous:false,fourier:false,particles:true,tunnel:false};
    // User overrides (once user manually toggles, auto-phase won't override that layer)
    this.userOverrides=new Set();
    // Systems
    this.breath=new BreathingSystem();this.timeSys=new TimeSystem();
    this.colors=new ColorSystem();this.mic=new MicrophoneSystem();
    this.particles=new ParticlePool(2000);this.ripples=new RippleSystem();
    this.trail=new TrailSystem(100);this.rd=new ReactionDiffusion();
    this.attractor=new StrangeAttractor();this.lissajous=new LissajousSystem();
    this.fourier=new FourierMandala();this.geometry=new GeometryEngine();
    this.tunnel=new TunnelEffect();this.spirits=new SpiritLights();this.sound=new SoundEngine();
    this.onboarding=new OnboardingSystem();
    this.ambientSpawned=false;this.micEnabled=false;
    this._setupHud();this._setupEvents();this.resize();
    window.addEventListener('resize',()=>this.resize());
  }

  // ── HUD layer toggle buttons ──
  _setupHud(){
    this.hud.querySelectorAll('.hud-btn').forEach(btn=>{
      // Sync initial button state with this.layers
      const layer=btn.dataset.layer;
      btn.classList.toggle('on',!!this.layers[layer]);
      btn.classList.toggle('off',!this.layers[layer]);
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        this.layers[layer]=!this.layers[layer];
        btn.classList.toggle('on',this.layers[layer]);
        btn.classList.toggle('off',!this.layers[layer]);
        this.userOverrides.add(layer); // user took control of this layer
      });
    });
  }

  // ── Advance to next phase, unlock layers ──
  _advancePhase(){
    if(this.phase>=PHASE_CONFIG.length-1)return;
    this.phase++;
    const cfg=PHASE_CONFIG[this.phase];
    // Apply layer config for layers user hasn't overridden
    for(const[layer,val]of Object.entries(cfg.layers)){
      if(!this.userOverrides.has(layer)){
        this.layers[layer]=val;
        const btn=this.hud.querySelector(`[data-layer="${layer}"]`);
        if(btn){btn.classList.toggle('on',val);btn.classList.toggle('off',!val);}
      }
    }
    // Show phase name briefly
    this.phaseLabel.textContent=cfg.name.toUpperCase();
    this.phaseLabel.classList.add('visible');
    setTimeout(()=>this.phaseLabel.classList.remove('visible'),3000);
    // Set next threshold
    this.nextPhaseT=this.phase<PHASE_CONFIG.length-1?PHASE_CONFIG[this.phase+1].t:Infinity;
  }

  _setupEvents(){
    document.getElementById('mic-btn').addEventListener('click',e=>{
      e.stopPropagation();this.micEnabled=!this.micEnabled;
      document.getElementById('mic-btn').classList.toggle('active',this.micEnabled);
      document.getElementById('mic-btn').textContent=this.micEnabled?'🎤 Microphone On':'🎤 Enable Microphone';
    });
    this.entry.addEventListener('click',()=>{
      this.entry.classList.add('hidden');this.sound.init();
      if(this.micEnabled)this.mic.init(this.sound.audioCtx);
      this.started=true;this.lastTime=performance.now()/1000;
      this.mx=this.W/2;this.my=this.H/2;
      requestAnimationFrame(t=>this._loop(t));
    });
    window.addEventListener('mousemove',e=>{
      this.pmx=this.mx;this.pmy=this.my;this.mx=e.clientX;this.my=e.clientY;
      const dx=this.mx-this.pmx,dy=this.my-this.pmy;this.vel=Math.sqrt(dx*dx+dy*dy);this.idleTime=0;
      if(this.spirits.active)this.spirits.fadeAll();
    });
    window.addEventListener('mousedown',e=>{
      if(!this.started)return;
      if(this.onboarding.phase==='question'){this.onboarding.click(e.clientX,e.clientY,this.W,this.H);return;}
      if(!this.onboarding.isDone)return;
      this.down=true;this.holdDur=0;this._onClick(e.clientX,e.clientY);
    });
    window.addEventListener('mouseup',()=>{if(this.down&&this.holdDur>.3)this._onRelease();this.down=false;this.holdDur=0;this.sound.releaseHold();});
    window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];this.pmx=this.mx;this.pmy=this.my;this.mx=t.clientX;this.my=t.clientY;const dx=this.mx-this.pmx,dy=this.my-this.pmy;this.vel=Math.sqrt(dx*dx+dy*dy);this.idleTime=0;if(this.spirits.active)this.spirits.fadeAll();},{passive:false});
    window.addEventListener('touchstart',e=>{if(!this.started)return;const t=e.touches[0];this.mx=t.clientX;this.my=t.clientY;if(this.onboarding.phase==='question'){this.onboarding.click(this.mx,this.my,this.W,this.H);return;}if(!this.onboarding.isDone)return;this.down=true;this.holdDur=0;this._onClick(this.mx,this.my);});
    window.addEventListener('touchend',()=>{if(this.down&&this.holdDur>.3)this._onRelease();this.down=false;this.holdDur=0;this.sound.releaseHold();});
    // Show HUD on mouse move in main experience, hide after 3s idle
    let hudTimer=null;
    window.addEventListener('mousemove',()=>{
      if(!this.onboarding.isDone)return;
      this.hud.classList.add('visible');clearTimeout(hudTimer);
      hudTimer=setTimeout(()=>this.hud.classList.remove('visible'),3000);
    });
    window.addEventListener('dblclick',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
  }

  _onClick(x,y){
    const h=this.colors.hslValues().h;
    for(let i=0;i<80;i++){const a=Math.random()*TAU,s=2+Math.random()*6;this.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,1+Math.random()*1.5,2+Math.random()*3,h+Math.random()*40-20,2);}
    this.ripples.spawn(x,y,h);this.flashA=.15;this.geometry.pulse();
    this.sound.triggerClick(x/this.W,y/this.H);this.sound.startHold();
    for(let i=0;i<this.particles.count;i++){if(this.particles.type[i]!==0)continue;const dx=this.particles.x[i]-x,dy=this.particles.y[i]-y,dist=Math.sqrt(dx*dx+dy*dy)+1;if(dist<300){const f=(300-dist)/300*3;this.particles.vx[i]+=dx/dist*f;this.particles.vy[i]+=dy/dist*f;}}
  }
  _onRelease(){const h=this.colors.hslValues().h;for(let i=0;i<30;i++){const a=Math.random()*TAU,s=1+Math.random()*4;this.particles.spawn(this.mx,this.my,Math.cos(a)*s,Math.sin(a)*s,.8+Math.random(),1.5+Math.random()*2,h+60+Math.random()*30,3);}}

  startMainExperience(answers){
    this.modeName=selectMode(answers);
    this.colors.setMode(this.modeName);this.rd.setMode(this.modeName);
    this.attractor.setMode(this.modeName);this.fourier.setSym(MODES[this.modeName].sym);
    this.geometry.cur=0;this.geometry.tp=1;
    // Show phase label for phase 0
    this.phaseLabel.textContent=PHASE_CONFIG[0].name.toUpperCase();
    this.phaseLabel.classList.add('visible');
    setTimeout(()=>this.phaseLabel.classList.remove('visible'),3000);
  }

  resize(){
    const dpr=window.devicePixelRatio||1;this.W=window.innerWidth;this.H=window.innerHeight;
    this.canvas.width=this.W*dpr;this.canvas.height=this.H*dpr;
    this.canvas.style.width=this.W+'px';this.canvas.style.height=this.H+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  _spawnAmbient(){
    if(this.ambientSpawned)return;this.ambientSpawned=true;
    for(let i=0;i<300;i++)this.particles.spawn(Math.random()*this.W,Math.random()*this.H,(Math.random()-.5)*.5,(Math.random()-.5)*.5,9999,1+Math.random()*2,Math.random()*360,0);
  }

  _loop(ts){
    requestAnimationFrame(t=>this._loop(t));
    try{
      const now=ts/1000,dt=clamp(now-this.lastTime,0,.05);
      if(!isFinite(dt)||dt<=0){this.lastTime=now;return;}
      this.lastTime=now;this.time+=dt;this.idleTime+=dt;
      this.timeSys.update();this.breath.update(dt);
      if(this.mic.active)this.mic.update();else this.mic.fallback(this.time);
      const audio=this.mic;

      if(!this.onboarding.isDone){
        this.onboarding.update(dt,this.mx,this.my,this.W,this.H);
        if(this.onboarding.isDone)this.startMainExperience(this.onboarding.answers);
        this._renderOnboarding();return;
      }

      // ── Phase auto-advance ──
      this.phaseTimer+=dt;
      if(this.phase<PHASE_CONFIG.length-1&&this.phaseTimer>=this.nextPhaseT)this._advancePhase();

      this._spawnAmbient();
      this.colors.update(dt,this.timeSys);
      this.trail.update(dt);this.particles.update(dt,this.mx,this.my);
      this.ripples.update(dt);
      this.geometry.update(dt,this.breath,this.W,this.H,this.down,this.mx,this.my,this.timeSys);
      this.attractor.update(dt);this.lissajous.update(dt,audio);
      this.fourier.update(dt);this.rd.update(audio.bass);
      if(this.layers.tunnel)this.tunnel.update(dt,audio,this.breath,this.timeSys);
      this.spirits.update(dt);this.sound.updateDrone(this.time);

      if(this.vel>.5){
        this.trail.push(this.mx,this.my);
        if(this.vel>2){const n=Math.min(3,this.vel/8|0),h=this.colors.hslValues(this.vel*2).h;for(let i=0;i<n;i++)this.particles.spawn(this.mx+(Math.random()-.5)*10,this.my+(Math.random()-.5)*10,(Math.random()-.5)*1.5,(Math.random()-.5)*1.5,.5+Math.random()*.8,1+Math.random()*1.5,h+Math.random()*20,1);}
        if(this.time-this.lastRipple>.1){this.ripples.spawn(this.mx,this.my,this.colors.hslValues().h);this.lastRipple=this.time;}
        this.sound.updateMove(this.mx/this.W,this.my/this.H,this.vel);
      }else{this.sound.fadeMove();}

      if(this.down){this.holdDur+=dt;this.sound.updateHold(this.holdDur);if(this.holdDur>.2){for(let i=0;i<8;i++){const a=this.time*5+i*TAU/8,s=2+Math.random()*2,h=this.colors.hslValues(this.holdDur*30).h;this.particles.spawn(this.mx,this.my,Math.cos(a)*s,Math.sin(a)*s,.6+Math.random()*.6,1.5+Math.random(),h,3);}if(this.holdDur>.5&&this.layers.tunnel){this.tunnel.boostFromHold();if(!this.tunnel.active)this.tunnel.trigger(3+this.holdDur);}}}
      // Audio-reactive ambient particle bursts (bass spikes spawn extra particles)
      if(audio.bass>.55&&Math.random()<audio.bass*dt*8){const h=this.colors.hslValues(audio.bass*80).h;for(let i=0;i<3;i++)this.particles.spawn(Math.random()*this.W,Math.random()*this.H,(Math.random()-.5)*2,(Math.random()-.5)*2,2+Math.random()*2,1.5+Math.random()*2,h+Math.random()*30,1);}
      if(this.idleTime>10&&Math.random()<dt*.3)this.spirits.spawn(this.W,this.H,this.colors.hslValues(Math.random()*60).h);
      if(this.flashA>0)this.flashA*=.88;this.vel*=.85;
      this._renderMain(audio);
    }catch(e){}
  }

  _renderOnboarding(){
    const ctx=this.ctx,{W,H}=this,bg=this.breath.value;
    const bgG=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
    bgG.addColorStop(0,`hsla(260,30%,${6+bg*3}%,1)`);bgG.addColorStop(1,'hsla(270,15%,2%,1)');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    this.onboarding.draw(ctx,W,H,this.time,this.colors);
    const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.8);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  }

  _renderMain(audio){
    const ctx=this.ctx,{W,H}=this,bg=this.breath.value,m=MODES[this.modeName];
    const bgH=((m.bgH+this.timeSys.hueShift)+360)%360;
    // Phase 3 "Dissolution" — extra alpha overlay for depth
    const dissolveMix=this.phase>=3?.15:0;

    // Layer 0: Background (audio-reactive — bass pulses the glow, volume brightens)
    const audioPulse=audio.bass*.4+audio.volume*.15;
    const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*(.6+bg*.15+audioPulse*.1));
    grad.addColorStop(0,`hsla(${bgH|0},${40+audio.bass*20|0}%,${m.bgL+bg*4+audioPulse*6}%,1)`);
    grad.addColorStop(.5,`hsla(${(bgH+20)|0},30%,${m.bgL*.6+bg*2+audioPulse*3}%,1)`);
    grad.addColorStop(1,`hsla(${(bgH+40)|0},20%,${2+audioPulse*2}%,1)`);
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

    // Dissolution phase: subtle second layer for extra depth
    if(dissolveMix>0){
      ctx.fillStyle=`hsla(${bgH|0},60%,${m.bgL+8}%,${dissolveMix})`;ctx.fillRect(0,0,W,H);
    }

    // Layer 1: Reaction-Diffusion
    if(this.layers.rd)this.rd.draw(ctx,W,H,this.colors,.28+audio.bass*.12);

    // Layer 2: Strange Attractor
    if(this.layers.attractor)this.attractor.draw(ctx,W,H,this.colors,audio);

    // Layer 3: Sacred Geometry (audio-reactive scale)
    if(this.layers.geometry){ctx.save();const aScale=1+audio.bass*.08+audio.volume*.04;ctx.translate(W/2,H/2);ctx.scale(aScale,aScale);ctx.translate(-W/2,-H/2);this.geometry.draw(ctx,W,H,this.colors,this.breath);ctx.restore();}

    // Layer 4: Lissajous
    if(this.layers.lissajous)this.lissajous.draw(ctx,W/2,H/2,Math.min(W,H)*.22*this.breath.scale,this.colors,audio);

    // Layer 5: Fourier Mandala
    if(this.layers.fourier)this.fourier.draw(ctx,W/2,H/2,Math.min(W,H)*.28,this.colors,audio);

    // Layer 5.5: Tunnel zoom-in
    if(this.layers.tunnel)this.tunnel.draw(ctx,W,H,this.colors,audio);

    // Layer 6: Trail
    this.trail.draw(ctx,this.colors);

    // Layer 7: Ripples
    this.ripples.draw(ctx);

    // Layer 8: Particles
    if(this.layers.particles)this.particles.draw(ctx);

    // Spirit lights
    this.spirits.draw(ctx);

    // Flash (click + audio bass pulse)
    const bassPulseA=Math.max(0,audio.bass-.5)*.35;// visible above .5 threshold
    const totalFlash=Math.max(this.flashA,bassPulseA);
    if(totalFlash>.005){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=`hsla(${this.colors.hslValues().h|0},60%,80%,${totalFlash.toFixed(3)})`;ctx.fillRect(0,0,W,H);ctx.restore();}

    // Vignette
    const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

    // Full audio debug display at bottom
    this.mic.drawDebug(ctx,W,H);
  }
}

new App();
</script>
