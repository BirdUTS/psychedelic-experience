<script>
'use strict';
const TAU=Math.PI*2;
const PENTATONIC=[0,2,4,7,9];
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ═══════════════════════════════════════════
// SCENE PALETTE DEFINITIONS
// ═══════════════════════════════════════════
const SCENES=[
  {name:'Collatz Forest',  layers:{collatz:1,gol:0,rd:0,attractor:0,geometry:0,lissajous:0,fourier:0,tunnel:0,particles:1},hMin:0,hMax:360,sLo:.9,sHi:1,lLo:.55,lHi:.72,bgH:120,bgL:12,speed:1},
  {name:'Cellular Genesis', layers:{collatz:0,gol:1,rd:0,attractor:0,geometry:0,lissajous:0,fourier:0,tunnel:0,particles:1},hMin:0,hMax:360,sLo:.88,sHi:1,lLo:.5,lHi:.7,bgH:280,bgL:13,speed:.9},
  {name:'Sacred Geometry',  layers:{collatz:0,gol:0,rd:0,attractor:0,geometry:1,lissajous:0,fourier:1,tunnel:0,particles:1},hMin:0,hMax:360,sLo:.9,sHi:1,lLo:.55,lHi:.7,bgH:260,bgL:12,speed:.8},
  {name:'Neural Web',       layers:{collatz:0,gol:0,rd:0,attractor:1,geometry:0,lissajous:1,fourier:0,tunnel:0,particles:1},hMin:0,hMax:360,sLo:.85,sHi:1,lLo:.5,lHi:.68,bgH:200,bgL:11,speed:1.1},
  {name:'Chemical Dreams',  layers:{collatz:0,gol:0,rd:1,attractor:0,geometry:0,lissajous:0,fourier:0,tunnel:0,particles:1},hMin:0,hMax:360,sLo:.88,sHi:1,lLo:.52,lHi:.7,bgH:30,bgL:13,speed:.7},
  {name:'Wormhole',         layers:{collatz:0,gol:0,rd:0,attractor:0,geometry:.6,lissajous:0,fourier:0,tunnel:1,particles:1},hMin:0,hMax:360,sLo:.9,sHi:1,lLo:.55,lHi:.72,bgH:180,bgL:12,speed:1.2},
  {name:'Cosmic Dance',     layers:{collatz:.7,gol:.7,rd:0,attractor:0,geometry:0,lissajous:0,fourier:0,tunnel:.6,particles:1},hMin:0,hMax:360,sLo:.92,sHi:1,lLo:.55,lHi:.75,bgH:320,bgL:14,speed:1},
];

// ═══════════════════════════════════════════
// BREATHING SYSTEM (~12 BPM)
// ═══════════════════════════════════════════
class BreathingSystem{
  constructor(){this.phase=0;}
  update(dt){this.phase+=dt/5*TAU;}
  get value(){return .5+.5*Math.sin(this.phase);}
  get scale(){return .95+.1*this.value;}
}

// ═══════════════════════════════════════════
// TIME SYSTEM
// ═══════════════════════════════════════════
class TimeSystem{
  constructor(){this.hueShift=0;this.speedMod=1;this.chaos=0;this.pulse=0;this.seed=0;this.minutePhase=0;this.secondWave=0;}
  update(){
    const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();
    this.hueShift=h>=6&&h<11?25:h>=11&&h<16?0:h>=16&&h<21?-15:-35;
    this.speedMod=h>=0&&h<6?.5:h>=12&&h<18?1.1:1.0;
    this.minutePhase=(m+s/60)/60*TAU;
    this.secondWave=Math.sin((s+ms/1000)/60*TAU*5)*.5+.5;
    this.seed=Math.floor((h*3600+m*60+s)/7);
    this.chaos=h>=0&&h<5?.6+.2*Math.sin(m/60*TAU):h>=17&&h<20?.3+.15*Math.sin(m/60*TAU):.1;
    this.pulse=.5+.5*Math.sin((s+ms/1000)*TAU/5);
  }
}

// ═══════════════════════════════════════════
// COLOR SYSTEM — EXTREMELY VIBRANT
// ═══════════════════════════════════════════
class ColorSystem{
  constructor(){this.hueBase=Math.random()*360;this.sLo=.9;this.sHi=1;this.lLo=.55;this.lHi=.72;this.bgH=260;this.bgL=12;this.speed=1;}
  setScene(sc){this.sLo=sc.sLo;this.sHi=sc.sHi;this.lLo=sc.lLo;this.lHi=sc.lHi;this.bgH=sc.bgH;this.bgL=sc.bgL;this.speed=sc.speed;}
  update(dt,ts){this.hueBase+=(dt*8*(this.speed||1)+(ts?ts.hueShift*.002+ts.secondWave*.3:0));if(this.hueBase>360)this.hueBase-=360;}
  hsl(off=0,alpha=1){
    const s=Math.min(100,((this.sLo+this.sHi)/2*100+5)|0),l=Math.min(80,((this.lLo+this.lHi)/2*100+5)|0);
    let h=(this.hueBase+off)%360;if(h<0)h+=360;
    return `hsla(${h|0},${s}%,${l}%,${alpha})`;
  }
  hslValues(off=0){
    let h=(this.hueBase+off)%360;if(h<0)h+=360;
    return{h,s:(this.sLo+this.sHi)/2,l:(this.lLo+this.lHi)/2};
  }
}

// ═══════════════════════════════════════════
// MICROPHONE SYSTEM (FFT → bass/mid/treble)
// ═══════════════════════════════════════════
class MicrophoneSystem{
  constructor(){this.active=false;this.bass=0;this.mid=0;this.treble=0;this.volume=0;this.analyser=null;this.data=null;this.rawFFT=new Uint8Array(128);this.initError='';}
  async init(actx){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      this.analyser=actx.createAnalyser();this.analyser.fftSize=256;this.analyser.smoothingTimeConstant=.8;
      actx.createMediaStreamSource(stream).connect(this.analyser);
      this.data=new Uint8Array(this.analyser.frequencyBinCount);
      this.rawFFT=new Uint8Array(this.analyser.frequencyBinCount);
      this.active=true;
      const btn=document.getElementById('mic-btn');
      if(btn){btn.classList.add('active');btn.textContent='🎤 Microphone Active';}
    }catch(e){this.active=false;this.initError=e.message||'Permission denied';}
  }
  update(){
    if(!this.active||!this.analyser)return;
    this.analyser.getByteFrequencyData(this.data);
    this.rawFFT.set(this.data);
    const n=this.data.length;let b=0,m=0,tr=0,v=0;
    for(let i=0;i<n;i++){const x=this.data[i]/255;v+=x;if(i<n*.08)b+=x;else if(i<n*.5)m+=x;else tr+=x;}
    const S=.8;
    this.bass=lerp(b/(n*.08),this.bass,S);
    this.mid=lerp(m/(n*.42),this.mid,S);
    this.treble=lerp(tr/(n*.5),this.treble,S);
    this.volume=lerp(v/n,this.volume,S);
  }
  drawIndicator(ctx,W,H){
    // Subtle mic indicator — small pulsing dot in bottom-left corner
    const t=performance.now()/1000;
    const x=18,y=H-18,r=5;
    const pulse=.6+.4*Math.sin(t*2);
    ctx.save();ctx.globalCompositeOperation='screen';
    if(this.active){
      // Green glow — mic is live
      const g=ctx.createRadialGradient(x,y,0,x,y,r*3);
      g.addColorStop(0,`rgba(0,255,136,${(.5*pulse).toFixed(2)})`);
      g.addColorStop(.5,`rgba(0,255,136,${(.15*pulse).toFixed(2)})`);
      g.addColorStop(1,'rgba(0,255,136,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,TAU);ctx.fill();
      ctx.fillStyle=`rgba(0,255,136,${(.8+.2*pulse).toFixed(2)})`;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
      // Volume ring
      const vr=r+2+this.volume*8;
      ctx.strokeStyle=`rgba(0,255,136,${(this.volume*.5).toFixed(2)})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,vr,0,TAU);ctx.stroke();
    }else{
      // Dim amber dot — simulated audio
      const a=.2+.1*pulse;
      ctx.fillStyle=`rgba(180,120,60,${a.toFixed(2)})`;ctx.beginPath();ctx.arc(x,y,r*.7,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  fallback(t){
    const hit=Math.max(0,Math.sin(t*1.3)-.7)*3;
    this.bass=.3+.2*Math.sin(t*.7)+.1*Math.sin(t*.23+3)+hit*.15;
    this.mid=.25+.15*Math.sin(t*1.1+1)+.08*Math.sin(t*.37+2);
    this.treble=.15+.1*Math.sin(t*1.9+2)+.06*Math.sin(t*2.7);
    this.volume=.25+.15*Math.sin(t*.5)+hit*.1;
  }
}

// ═══════════════════════════════════════════
// PARTICLE POOL (typed arrays)
// ═══════════════════════════════════════════
class ParticlePool{
  constructor(max){
    this.max=max;this.count=0;
    this.x=new Float32Array(max);this.y=new Float32Array(max);this.z=new Float32Array(max);
    this.vx=new Float32Array(max);this.vy=new Float32Array(max);this.vz=new Float32Array(max);
    this.life=new Float32Array(max);this.ml=new Float32Array(max);
    this.size=new Float32Array(max);this.hue=new Float32Array(max);
    this.type=new Uint8Array(max);
  }
  spawn(x,y,vx,vy,life,size,hue,type,z=0,vz=0){
    let i;
    if(this.count<this.max){i=this.count++;}
    else{let mn=Infinity,mi=0;for(let j=0;j<this.max;j++)if(this.life[j]<mn){mn=this.life[j];mi=j;}i=mi;}
    this.x[i]=x;this.y[i]=y;this.z[i]=z;this.vx[i]=vx;this.vy[i]=vy;this.vz[i]=vz;
    this.life[i]=life;this.ml[i]=life;this.size[i]=size;this.hue[i]=hue;this.type[i]=type;
  }
  update(dt,mx,my){
    for(let i=this.count-1;i>=0;i--){
      this.life[i]-=dt;
      if(this.life[i]<=0){this.count--;if(i<this.count){this.x[i]=this.x[this.count];this.y[i]=this.y[this.count];this.z[i]=this.z[this.count];this.vx[i]=this.vx[this.count];this.vy[i]=this.vy[this.count];this.vz[i]=this.vz[this.count];this.life[i]=this.life[this.count];this.ml[i]=this.ml[this.count];this.size[i]=this.size[this.count];this.hue[i]=this.hue[this.count];this.type[i]=this.type[this.count];}continue;}
      const tp=this.type[i];
      if(tp===0||tp===4){const dx=mx-this.x[i],dy=my-this.y[i],dsq=dx*dx+dy*dy+1,f=Math.min(50/dsq,.5);this.vx[i]+=dx*f*dt*60;this.vy[i]+=dy*f*dt*60;}
      const fr=tp===0?.999:tp===4?.998:.97;
      this.vx[i]*=fr;this.vy[i]*=fr;this.x[i]+=this.vx[i]*dt*60;this.y[i]+=this.vy[i]*dt*60;this.z[i]+=this.vz[i]*dt*60;
    }
  }
  draw(ctx,cam){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<this.count;i++){
      const a=clamp(this.life[i]/this.ml[i]*2,0,1);if(a<.01)continue;
      let x=this.x[i],y=this.y[i],sz=this.size[i]*(.5+.5*(this.life[i]/this.ml[i]));
      if(cam){const p=cam.project(x,y,this.z[i]);if(!p)continue;x=p.x;y=p.y;sz*=p.s;}
      const h=this.hue[i],gr=sz*3;
      const g=ctx.createRadialGradient(x,y,0,x,y,gr);
      g.addColorStop(0,`hsla(${h|0},95%,70%,${(a*.9).toFixed(2)})`);
      g.addColorStop(.4,`hsla(${h|0},90%,65%,${(a*.35).toFixed(2)})`);
      g.addColorStop(1,`hsla(${h|0},90%,55%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,gr,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// RIPPLE SYSTEM
// ═══════════════════════════════════════════
class RippleSystem{
  constructor(){this.r=[];}
  spawn(x,y,hue){if(this.r.length>=20)this.r.shift();this.r.push({x,y,r:0,a:.6,hue,maxR:150+Math.random()*100});}
  update(dt){for(let i=this.r.length-1;i>=0;i--){const r=this.r[i];r.r+=dt*120;r.a=.6*(1-r.r/r.maxR);if(r.a<=.01)this.r.splice(i,1);}}
  draw(ctx){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(const r of this.r){ctx.strokeStyle=`hsla(${r.hue|0},90%,65%,${r.a.toFixed(2)})`;ctx.lineWidth=Math.max(1,3*(1-r.r/r.maxR));ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// TRAIL SYSTEM (ring buffer)
// ═══════════════════════════════════════════
class TrailSystem{
  constructor(len){this.len=len;this.pts=Array.from({length:len},()=>({x:0,y:0,age:999}));this.head=0;this.active=false;}
  push(x,y){this.pts[this.head]={x,y,age:0};this.head=(this.head+1)%this.len;this.active=true;}
  update(dt){for(let i=0;i<this.len;i++)this.pts[i].age+=dt;}
  draw(ctx,colors){
    if(!this.active)return;
    const live=[];for(let i=0;i<this.len;i++){const p=this.pts[(this.head+i)%this.len];if(p.age<2)live.push(p);}
    if(live.length<3)return;
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=1;i<live.length-1;i++){
      const p=live[i],t=1-p.age/2;if(t<=0)continue;
      ctx.strokeStyle=colors.hsl(t*60,t*t*.8);ctx.lineWidth=t*5+1;ctx.lineCap='round';
      const pv=live[i-1],nx=live[i+1];
      ctx.beginPath();ctx.moveTo((pv.x+p.x)/2,(pv.y+p.y)/2);ctx.quadraticCurveTo(p.x,p.y,(p.x+nx.x)/2,(p.y+nx.y)/2);ctx.stroke();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// REACTION-DIFFUSION (Gray-Scott, 128x128)
// ═══════════════════════════════════════════
class ReactionDiffusion{
  constructor(){
    this.W=128;this.H=128;this.N=this.W*this.H;
    this.u=new Float32Array(this.N).fill(1);this.v=new Float32Array(this.N);
    this.nu=new Float32Array(this.N);this.nv=new Float32Array(this.N);
    this.f=.0545;this.k=.062;this.fc=0;
    this.offC=document.createElement('canvas');this.offC.width=this.W;this.offC.height=this.H;
    this.offCtx=this.offC.getContext('2d');
    this.imgData=this.offCtx.createImageData(this.W,this.H);
    this._seed();
  }
  _seed(){
    const cx=this.W>>1,cy=this.H>>1;
    [[cx,cy,6],[cx-20,cy-20,4],[cx+20,cy+15,4],[cx-15,cy+20,4]].forEach(([sx,sy,r])=>{
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy<=r*r){const i=(sy+dy)*this.W+(sx+dx);if(i>=0&&i<this.N){this.u[i]=.5;this.v[i]=.25;}}}
    });
  }
  _step(){
    const{W,H,u,v,nu,nv,f,k}=this;
    for(let y=1;y<H-1;y++){for(let x=1;x<W-1;x++){
      const i=y*W+x,lu=u[i-1]+u[i+1]+u[i-W]+u[i+W]-4*u[i],lv=v[i-1]+v[i+1]+v[i-W]+v[i+W]-4*v[i],uvv=u[i]*v[i]*v[i];
      nu[i]=clamp(u[i]+lu*.25-uvv+f*(1-u[i]),0,1);
      nv[i]=clamp(v[i]+lv*.125+uvv-(f+k)*v[i],0,1);
    }}
    for(let i=0;i<this.N;i++){this.u[i]=this.nu[i];this.v[i]=this.nv[i];}
  }
  update(){this.fc++;if(this.fc%3!==0)return;this._step();this._step();}
  draw(ctx,W,H,colors,alpha){
    const{u,imgData}=this,d=imgData.data,{h}=colors.hslValues();
    for(let i=0;i<this.N;i++){
      const t=clamp(1-u[i],0,1),hue=(h+t*180)%360;
      const r2=Math.sin(hue/360*TAU)*127+128,g2=Math.sin((hue/360+.33)*TAU)*127+128,b2=Math.sin((hue/360+.66)*TAU)*127+128;
      d[i*4]=Math.min(255,(r2*t*1.8)|0);d[i*4+1]=Math.min(255,(g2*t*1.8)|0);d[i*4+2]=Math.min(255,(b2*t*1.8)|0);d[i*4+3]=(t*255)|0;
    }
    this.offCtx.putImageData(imgData,0,0);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=alpha;
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(this.offC,0,0,W,H);ctx.restore();
  }
}

// ═══════════════════════════════════════════
// STRANGE ATTRACTOR (De Jong, persistent canvas)
// ═══════════════════════════════════════════
class StrangeAttractor{
  constructor(){
    this.a=1.4;this.b=-2.3;this.c=2.4;this.d=-2.1;
    this.ta=this.a;this.tb=this.b;this.tc=this.c;this.td=this.d;
    this.x=.1;this.y=.1;this.mt=0;
    this.offC=document.createElement('canvas');this.offCtx=this.offC.getContext('2d');
  }
  update(dt){
    this.mt+=dt;
    if(this.mt>12){this.mt=0;this.ta=clamp(this.ta+(Math.random()-.5)*.4,-3,3);this.tb=clamp(this.tb+(Math.random()-.5)*.4,-3,3);this.tc=clamp(this.tc+(Math.random()-.5)*.4,-3,3);this.td=clamp(this.td+(Math.random()-.5)*.4,-3,3);}
    const s=dt*.2;this.a=lerp(this.a,this.ta,s);this.b=lerp(this.b,this.tb,s);this.c=lerp(this.c,this.tc,s);this.d=lerp(this.d,this.td,s);
  }
  draw(ctx,W,H,colors,audio){
    if(this.offC.width!==W||this.offC.height!==H){this.offC.width=W;this.offC.height=H;}
    const oc=this.offCtx;
    oc.fillStyle='rgba(0,0,0,0.06)';oc.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2,sc=Math.min(W,H)*.22,{h}=colors.hslValues();
    let{x,y,a,b,c,d}=this;
    const N=5000+(audio.bass*5000|0);
    for(let i=0;i<N;i++){
      const nx=Math.sin(a*y)-Math.cos(b*x),ny=Math.sin(c*x)-Math.cos(d*y);x=nx;y=ny;
      if(i<80)continue;
      const ph=(h+i*.05)%360;
      oc.fillStyle=`hsla(${ph|0},95%,65%,0.08)`;
      oc.fillRect(cx+x*sc|0,cy+y*sc|0,2,2);
    }
    this.x=x;this.y=y;
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.9;ctx.drawImage(this.offC,0,0);ctx.restore();
  }
}

// ═══════════════════════════════════════════
// LISSAJOUS (audio-reactive parametric curves)
// ═══════════════════════════════════════════
class LissajousSystem{
  constructor(){this.fA=3;this.fB=2;this.phase=0;}
  update(dt,audio){this.phase+=dt*.25;this.fA=lerp(this.fA,2+(audio.mid*4|0),dt*.4);this.fB=lerp(this.fB,1+(audio.bass*3|0),dt*.4);}
  draw(ctx,cx,cy,size,colors,audio){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let pass=0;pass<3;pass++){
      ctx.lineWidth=pass===0?4:pass===1?2:.8;
      ctx.beginPath();
      for(let i=0;i<=512;i++){const t=(i/512)*TAU,x=cx+Math.sin(this.fA*t+this.phase)*size*(1+pass*.02),y=cy+Math.sin(this.fB*t)*size*(1+pass*.02);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.strokeStyle=colors.hsl(-40+pass*60,.7+audio.volume*.3-pass*.15);ctx.stroke();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// FOURIER MANDALA (epicycle sum, N-fold symmetric)
// ═══════════════════════════════════════════
class FourierMandala{
  constructor(){this.t=0;this.sym=6;}
  setSym(n){this.sym=n;}
  update(dt){this.t+=dt*.15;}
  draw(ctx,cx,cy,size,colors,audio){
    const N=this.sym,freqs=[N,N*2,N*3,N*4,N*5,N*6];
    const bAmps=[.48,.22,.13,.08,.05,.03];
    const mods=[1+audio.bass*.6,1+audio.mid*.4,1+audio.treble*.3,1+audio.bass*.2,1+audio.mid*.15,1+audio.treble*.1];
    const steps=N*24;
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let pass=0;pass<2;pass++){
      ctx.beginPath();
      for(let s=0;s<=steps;s++){
        const t=(s/steps)*TAU;let x=0,y=0;
        for(let i=0;i<freqs.length;i++){const amp=size*bAmps[i]*mods[i],ph=this.t*(i*.12+.04);x+=Math.cos(freqs[i]*t+ph)*amp;y+=Math.sin(freqs[i]*t+ph)*amp;}
        s===0?ctx.moveTo(cx+x,cy+y):ctx.lineTo(cx+x,cy+y);
      }
      ctx.closePath();
      ctx.strokeStyle=colors.hsl(pass===0?80:160,.8+audio.volume*.2);
      ctx.lineWidth=pass===0?3:1.5;ctx.stroke();
    }
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// GEOMETRY ENGINE (4 sacred patterns)
// ═══════════════════════════════════════════
class GeometryEngine{
  constructor(){this.pats=['flowerOfLife','metatronsCube','sriYantra','mandala'];this.cur=0;this.nxt=1;this.tp=1;this.tt=0;this.td=35+Math.random()*25;this.rot=0;this.ps=1;this.pv=0;this.cx=0;this.cy=0;}
  update(dt,breath,W,H,mouseDown,mx,my,timeSys){
    const tsDrift=timeSys?Math.sin(timeSys.minutePhase)*.05:0;
    this.rot+=dt*(.15+tsDrift)*(breath.value*.3+.85);this.tt+=dt;
    this.pv*=.92;this.ps+=this.pv*dt;this.ps+=(1-this.ps)*dt*3;
    this.cx=lerp(this.cx||W/2,mouseDown?lerp(W/2,mx,.3):W/2,dt*2);
    this.cy=lerp(this.cy||H/2,mouseDown?lerp(H/2,my,.3):H/2,dt*2);
    if(this.tt>this.td&&this.tp>=1){this.tt=0;this.td=30+Math.random()*30;this.nxt=(this.cur+1)%this.pats.length;this.tp=0;}
    if(this.tp<1){this.tp+=dt*.25;if(this.tp>=1){this.tp=1;this.cur=this.nxt;}}
  }
  pulse(){this.pv=3;}
  draw(ctx,W,H,colors,breath){
    const sz=Math.min(W,H)*.3*breath.scale*this.ps;
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(this.cx,this.cy);ctx.rotate(this.rot);
    if(this.tp<1){ctx.globalAlpha=1-this.tp*.3;this._dp(ctx,this.pats[this.cur],sz,colors,breath);ctx.globalAlpha=this.tp;this._dp(ctx,this.pats[this.nxt],sz,colors,breath);}
    else{ctx.globalAlpha=1;this._dp(ctx,this.pats[this.cur],sz,colors,breath);}
    ctx.restore();
  }
  _dp(ctx,name,sz,co,br){
    if(name==='flowerOfLife')this._fol(ctx,sz,co,br);
    else if(name==='metatronsCube')this._mc(ctx,sz,co,br);
    else if(name==='sriYantra')this._sy(ctx,sz,co,br);
    else this._mandala(ctx,sz,co,br);
  }
  _fol(ctx,sz,co,br){
    const r=sz*.25,cs=[{x:0,y:0}];
    for(let i=0;i<6;i++){const a=i*TAU/6;cs.push({x:Math.cos(a)*r,y:Math.sin(a)*r});}
    for(let i=0;i<6;i++){const a=i*TAU/6;cs.push({x:Math.cos(a)*r*2,y:Math.sin(a)*r*2});cs.push({x:Math.cos((i+.5)*TAU/6)*r*1.732,y:Math.sin((i+.5)*TAU/6)*r*1.732});}
    for(let i=0;i<cs.length;i++){
      const c=cs[i],bR=r*(1+.03*Math.sin(br.phase+i*.2));
      // Solid fill with glow
      const fillA=(.12+.08*Math.sin(br.phase+i*.3)).toFixed(2);
      ctx.fillStyle=co.hsl((i/cs.length)*180,parseFloat(fillA));
      ctx.beginPath();ctx.arc(c.x,c.y,bR,0,TAU);ctx.fill();
      ctx.strokeStyle=co.hsl((i/cs.length)*180,.95);ctx.lineWidth=2.5;ctx.stroke();
    }
  }
  _mc(ctx,sz,co,br){
    const r1=sz*.3,r2=sz*.55,ns=[{x:0,y:0}];
    for(let i=0;i<6;i++){const a=i*TAU/6+br.phase*.05;ns.push({x:Math.cos(a)*r1,y:Math.sin(a)*r1});}
    for(let i=0;i<6;i++){const a=(i+.5)*TAU/6+br.phase*.03;ns.push({x:Math.cos(a)*r2,y:Math.sin(a)*r2});}
    // Draw filled triangles between connected nodes
    for(let i=1;i<7;i++){const j=(i%6)+1;
      ctx.fillStyle=co.hsl(i*60,.12+.06*Math.sin(br.phase+i));
      ctx.beginPath();ctx.moveTo(ns[0].x,ns[0].y);ctx.lineTo(ns[i].x,ns[i].y);ctx.lineTo(ns[j].x,ns[j].y);ctx.closePath();ctx.fill();
    }
    ctx.lineWidth=1.2;
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){const dx=ns[j].x-ns[i].x,dy=ns[j].y-ns[i].y,ang=Math.atan2(dy,dx),dist=Math.sqrt(dx*dx+dy*dy),al=.5+.3*Math.sin(br.phase+dist*.01);ctx.strokeStyle=co.hsl((ang/TAU)*360,Math.max(0,al));ctx.beginPath();ctx.moveTo(ns[i].x,ns[i].y);ctx.lineTo(ns[j].x,ns[j].y);ctx.stroke();}
    for(let i=0;i<ns.length;i++){ctx.fillStyle=co.hsl((i/ns.length)*180,1);ctx.beginPath();ctx.arc(ns[i].x,ns[i].y,5+2*Math.sin(br.phase+i),0,TAU);ctx.fill();}
  }
  _sy(ctx,sz,co,br){
    const s=sz*.5;
    const U=[[[-0.8,.5],[.8,.5],[0,-.7]],[[-0.65,.35],[.65,.35],[0,-.55]],[[-0.5,.2],[.5,.2],[0,-.4]],[[-0.3,.08],[.3,.08],[0,-.22]]];
    const D=[[[-0.75,-.45],[.75,-.45],[0,.65]],[[-0.6,-.32],[.6,-.32],[0,.52]],[[-0.48,-.22],[.48,-.22],[0,.38]],[[-0.35,-.12],[.35,-.12],[0,.25]],[[-0.2,-.04],[.2,-.04],[0,.13]]];
    const dt=(tris,hs)=>tris.forEach((tri,idx)=>{const ph=br.phase+idx*.5,bo=.01*Math.sin(ph);ctx.fillStyle=co.hsl(hs+idx*25,.15+.1*Math.sin(ph));ctx.strokeStyle=co.hsl(hs+idx*25,.75+.2*Math.sin(ph));ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tri[0][0]*s*(1+bo),tri[0][1]*s*(1+bo));ctx.lineTo(tri[1][0]*s*(1+bo),tri[1][1]*s*(1+bo));ctx.lineTo(tri[2][0]*s*(1+bo),tri[2][1]*s*(1+bo));ctx.closePath();ctx.fill();ctx.stroke();});
    dt(U,0);dt(D,180);
    for(let i=0;i<3;i++){ctx.strokeStyle=co.hsl(i*40,.45+.2*Math.sin(br.phase+i));ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,s*(.85+i*.06),0,TAU);ctx.stroke();}
  }
  _mandala(ctx,sz,co,br){
    const sym=12,layers=5;
    for(let l=0;l<layers;l++){
      const r=sz*(.15+l*.15),al=.6+.25*Math.sin(br.phase+l*.8),dir=l%2?1:-1;
      for(let i=0;i<sym;i++){const a=(i/sym)*TAU+br.phase*.1*dir,pR=r*.35*(1+.1*Math.sin(br.phase+i*.5));ctx.fillStyle=co.hsl((i/sym)*60+l*30,al*.5);ctx.strokeStyle=co.hsl((i/sym)*60+l*30,al);ctx.lineWidth=1.8;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.ellipse(r,0,pR,pR*.4,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}
      ctx.strokeStyle=co.hsl(l*50,al*.5);ctx.lineWidth=.8;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════
// TUNNEL EFFECT (zoom-in wormhole)
// ═══════════════════════════════════════════
class TunnelEffect{
  constructor(){
    this.rings=[];this.active=false;this.intensity=0;this.targetIntensity=0;
    this.eventTimer=0;this.eventInterval=25+Math.random()*20;
    this.eventDuration=0;this.maxDuration=8;
    this.rotation=0;this.shapePhase=0;this.holdBoost=0;
  }
  trigger(duration){if(this.active&&this.intensity>.5)return;this.active=true;this.targetIntensity=1;this.eventDuration=duration||6+Math.random()*6;}
  stop(){this.targetIntensity=0;}
  update(dt,audio,breath,timeSys){
    if(!this.active){this.eventTimer+=dt;if(this.eventTimer>=this.eventInterval){this.trigger();this.eventTimer=0;this.eventInterval=20+Math.random()*25+(timeSys?timeSys.chaos*15:0);}}
    if(this.active){
      this.intensity=lerp(this.intensity,this.targetIntensity,dt*1.5);
      this.eventDuration-=dt;
      if(this.eventDuration<=0){this.stop();this.eventDuration=0;}
      if(this.targetIntensity===0&&this.intensity<.02){this.active=false;this.intensity=0;}
    }
    this.holdBoost*=.9;
    const spawnRate=6+audio.bass*8+this.holdBoost*10;
    const spawnCount=Math.max(0,Math.floor(this.intensity*spawnRate*dt+Math.random()*.5));
    for(let i=0;i<spawnCount;i++){
      this.rings.push({r:2+Math.random()*8,speed:80+Math.random()*120+audio.bass*100+this.holdBoost*80,hueOff:Math.random()*40-20,alpha:.6+Math.random()*.3,sides:Math.random()<.3?6:Math.random()<.15?5:0,rot:Math.random()*TAU,width:1+Math.random()*1.5+audio.treble*2});
    }
    const speedMul=1+(breath?breath.value*.3:0)+(timeSys?timeSys.secondWave*.2:0);
    for(let i=this.rings.length-1;i>=0;i--){const ring=this.rings[i];ring.r+=ring.speed*speedMul*dt;ring.alpha-=dt*.15;ring.rot+=dt*.1*(ring.sides===5?-1:1);if(ring.alpha<=0||ring.r>2000)this.rings.splice(i,1);}
    this.rotation+=dt*.08*(1+audio.mid*.5);this.shapePhase+=dt*.15;
    if(this.rings.length>120)this.rings.splice(0,this.rings.length-120);
  }
  draw(ctx,W,H,colors,audio){
    if(!this.active&&this.rings.length===0)return;
    const cx=W/2,cy=H/2,maxR=Math.sqrt(W*W+H*H)/2;
    ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(cx,cy);ctx.rotate(this.rotation);
    for(const ring of this.rings){
      const normR=ring.r/maxR,a=ring.alpha*this.intensity*(1-normR*.5);if(a<.01)continue;
      const hue=colors.hslValues(ring.hueOff).h;
      ctx.strokeStyle=`hsla(${hue|0},90%,65%,${a.toFixed(3)})`;ctx.lineWidth=ring.width*(1+normR*.5);
      ctx.beginPath();
      if(ring.sides===0){ctx.arc(0,0,Math.max(1,ring.r),0,TAU);}
      else{const n=ring.sides,isStar=n===5;for(let j=0;j<=n;j++){const angle=ring.rot+j/n*TAU,rr=isStar?(j%2===0?ring.r:ring.r*.45):ring.r,px=Math.cos(angle)*Math.max(1,rr),py=Math.sin(angle)*Math.max(1,rr);j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();}
      ctx.stroke();
      if(ring.r<60&&a>.2){const g=ctx.createRadialGradient(0,0,Math.max(1,ring.r*.5),0,0,Math.max(2,ring.r*1.2));g.addColorStop(0,`hsla(${hue|0},95%,75%,${(a*.3).toFixed(3)})`);g.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,Math.max(2,ring.r*1.2),0,TAU);ctx.fill();}
    }
    ctx.restore();
  }
  boostFromHold(){this.holdBoost=1;}
}

// ═══════════════════════════════════════════
// SPIRIT LIGHTS (idle orbs)
// ═══════════════════════════════════════════
class SpiritLights{
  constructor(){this.lights=[];this.active=false;}
  spawn(W,H,hue){if(this.lights.length>=5)return;const e=Math.random()<.5?-50:W+50;this.lights.push({x:e,y:Math.random()*H,vx:(e<0?1:-1)*(20+Math.random()*30),vy:0,phase:Math.random()*TAU,size:8+Math.random()*12,hue,life:15,maxLife:15,fading:false});this.active=true;}
  fadeAll(){for(const l of this.lights)l.fading=true;}
  update(dt){for(let i=this.lights.length-1;i>=0;i--){const l=this.lights[i];l.phase+=dt*1.5;l.vy=Math.sin(l.phase)*40;l.x+=l.vx*dt;l.y+=l.vy*dt;l.life-=l.fading?dt*3:dt*.05;if(l.life<=0)this.lights.splice(i,1);}if(!this.lights.length)this.active=false;}
  draw(ctx){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(const l of this.lights){const a=clamp(l.life/l.maxLife,0,1)*.6,gr=l.size*4,g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,gr);g.addColorStop(0,`hsla(${l.hue|0},90%,80%,${(a*.9).toFixed(2)})`);g.addColorStop(.3,`hsla(${l.hue|0},85%,70%,${(a*.5).toFixed(2)})`);g.addColorStop(1,`hsla(${l.hue|0},80%,55%,0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(l.x,l.y,gr,0,TAU);ctx.fill();}
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
// COLLATZ TREE (NEW)
// ═══════════════════════════════════════════
class CollatzTree{
  constructor(){
    this.maxN=80;this.targetN=250;this.seqs=[];this.growT=0;this.growSpeed=.4;
    this.swayPhase=0;this.time=0;
    // Viewport tracking
    this.viewCX=0;this.viewCY=0;this.viewScale=1;
    this.targetCX=0;this.targetCY=0;this.targetScale=1;
    // 3D rotation feel
    this.rotY=0;this.rotPhase=0;
    this._precompute();
  }
  _collatz(n){const seq=[n];while(n!==1&&seq.length<200){n=n%2===0?n/2:3*n+1;seq.push(n);}return seq.reverse();}
  _precompute(){this.seqs=[];for(let i=2;i<=this.maxN;i++)this.seqs.push(this._collatz(i));}
  update(dt,audio){
    this.time+=dt;this.swayPhase+=dt*(.6+audio.mid*.8);
    this.growT+=dt*this.growSpeed*(1+audio.bass*.5);
    if(this.maxN<this.targetN&&this.growT>this.seqs.length*.06){this.maxN=Math.min(this.targetN,this.maxN+5);this._precompute();}
    // 3D rotation feel
    this.rotPhase+=dt*.15;this.rotY=Math.sin(this.rotPhase)*.25;
    // Smooth tracking viewport
    this.viewCX=lerp(this.viewCX,this.targetCX,dt*1.2);
    this.viewCY=lerp(this.viewCY,this.targetCY,dt*1.2);
    this.viewScale=lerp(this.viewScale,this.targetScale,dt*.8);
  }
  draw(ctx,W,H,colors,audio){
    const cx=W/2,by=H*.92,segLen=Math.min(H,W)*.018,angleStep=7*Math.PI/180;
    const maxVisible=Math.floor(this.growT*15);
    const bassPulse=1+audio.bass*.4;
    // Compute bounding box for tracking
    let minX=cx,maxX=cx,minY=by,maxY=by;
    ctx.save();ctx.globalCompositeOperation='screen';
    // Apply 3D rotation perspective + tracking viewport
    const cosR=Math.cos(this.rotY),scaleX=cosR*.3+.7; // foreshorten X for 3D feel
    ctx.translate(W/2,H/2);
    ctx.scale(this.viewScale*scaleX,this.viewScale);
    ctx.translate(-W/2-this.viewCX,-H/2-this.viewCY);
    for(let si=0;si<this.seqs.length;si++){
      const seq=this.seqs[si];
      const visCount=Math.min(seq.length,maxVisible-si*2);
      if(visCount<3)continue;
      ctx.beginPath();
      let x=cx,y=by,angle=-Math.PI/2;
      ctx.moveTo(x,y);
      for(let j=1;j<visCount;j++){
        const prevVal=seq[j-1];
        const turn=prevVal%2===0?-angleStep:angleStep;
        const sway=Math.sin(this.swayPhase+j*.15+si*.3)*.03*(j/visCount);
        angle+=turn+sway;
        const sl=segLen*bassPulse*(1+audio.bass*.2*Math.sin(this.time*3+j));
        x+=Math.cos(angle)*sl;y+=Math.sin(angle)*sl;
        ctx.lineTo(x,y);
      }
      if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
      const depthRatio=Math.min(1,visCount/60);
      const hue=(280+depthRatio*180)%360;
      const sat=95,lit=55+depthRatio*15;
      const lw=Math.max(.8,3.5-depthRatio*2.5);
      ctx.strokeStyle=`hsla(${hue|0},${sat}%,${lit|0}%,${(.5+depthRatio*.4).toFixed(2)})`;
      ctx.lineWidth=lw/this.viewScale;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
      if(visCount>15&&depthRatio>.3){
        const tipHue=(280+depthRatio*180)%360;
        const gr=4+audio.bass*6;
        const g=ctx.createRadialGradient(x,y,0,x,y,gr);
        g.addColorStop(0,`hsla(${tipHue|0},100%,75%,.7)`);
        g.addColorStop(1,`hsla(${tipHue|0},100%,60%,0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,gr,0,TAU);ctx.fill();
      }
    }
    ctx.restore();
    // Update tracking targets — center the tree and zoom to fit
    const treeCX=(minX+maxX)/2,treeCY=(minY+maxY)/2;
    const treeW=maxX-minX+60,treeH=maxY-minY+60;
    if(treeW>10&&treeH>10){

// ═══════════════════════════════════════════
// GAME OF LIFE (NEW)
// ═══════════════════════════════════════════
class GameOfLife{
  constructor(){
    this.W=128;this.H=128;this.N=this.W*this.H;
    this.grid=new Uint8Array(this.N);this.next=new Uint8Array(this.N);
    this.age=new Uint16Array(this.N);
    this.fc=0;this.injectTimer=0;
    this.offC=document.createElement('canvas');this.offC.width=this.W;this.offC.height=this.H;
    this.offCtx=this.offC.getContext('2d');
    this.imgData=this.offCtx.createImageData(this.W,this.H);
    this._seedRandom();
  }
  _seedRandom(){for(let i=0;i<this.N;i++){this.grid[i]=Math.random()<.3?1:0;this.age[i]=0;}}
  _inject(cx,cy,pattern){
    const pts=pattern==='glider'?[[0,1],[1,2],[2,0],[2,1],[2,2]]:pattern==='rpent'?[[0,1],[0,2],[1,0],[1,1],[2,1]]:pattern==='gun'?[[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]]:[];
    for(const[dy,dx]of pts){const x=(cx+dx)%this.W,y=(cy+dy)%this.H;this.grid[y*this.W+x]=1;this.age[y*this.W+x]=0;}
  }
  _step(){
    const{W,H,grid,next,age}=this;
    for(let y=0;y<H;y++){for(let x=0;x<W;x++){
      let n=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dy&&!dx)continue;n+=grid[((y+dy+H)%H)*W+(x+dx+W)%W];}
      const i=y*W+x,alive=grid[i];
      if(alive){next[i]=(n===2||n===3)?1:0;if(next[i])age[i]++;else age[i]=0;}
      else{next[i]=n===3?1:0;if(next[i])age[i]=0;}
    }}
    const tmp=this.grid;this.grid=this.next;this.next=tmp;
  }
  update(dt,audio){
    this.fc++;if(this.fc%2!==0)return;
    this._step();
    this.injectTimer++;
    if(this.injectTimer>200||audio.bass>.6){
      this.injectTimer=0;
      const cx=Math.random()*this.W|0,cy=Math.random()*this.H|0;
      const pats=['glider','rpent','gun'];
      this._inject(cx,cy,pats[Math.random()*pats.length|0]);
    }
  }
  draw(ctx,W,H,colors){
    const{grid,age,imgData}=this,d=imgData.data,{h:hBase}=colors.hslValues();
    for(let i=0;i<this.N;i++){
      if(!grid[i]){d[i*4]=0;d[i*4+1]=0;d[i*4+2]=0;d[i*4+3]=0;continue;}
      const a=age[i];
      if(a<2){d[i*4]=255;d[i*4+1]=255;d[i*4+2]=255;d[i*4+3]=255;}
      else{
        const hue=(hBase+a*12)%360,hr=hue/360;
        const r=Math.sin(hr*TAU)*127+128,g=Math.sin((hr+.33)*TAU)*127+128,b=Math.sin((hr+.66)*TAU)*127+128;
        d[i*4]=Math.min(255,(r*1.6)|0);d[i*4+1]=Math.min(255,(g*1.6)|0);d[i*4+2]=Math.min(255,(b*1.6)|0);d[i*4+3]=255;
      }
    }
    this.offCtx.putImageData(imgData,0,0);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.85;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(this.offC,0,0,W,H);ctx.restore();
  }
}

// SCENE DIRECTOR (NEW — replaces phase system)
// ═══════════════════════════════════════════
class SceneDirector{
  constructor(){
    this.scenes=SCENES;this.cur=0;this.nxt=1;
    this.timer=0;this.duration=15+Math.random()*15;
    this.fadeT=0;this.fading=false;this.fadeDur=3;
    this.weights={};this.targetWeights={};
    this._applyScene(0);
  }
  _applyScene(idx){
    const sc=this.scenes[idx]||this.scenes[0];
    if(!sc)return;
    this.targetWeights={};
    for(const[k,v]of Object.entries(sc.layers))this.targetWeights[k]=v;
  }
  currentScene(){return this.scenes[this.cur];}
  blendedScene(){
    const fallback=this.scenes[0];
    if(!this.fading)return this.scenes[this.cur]||fallback;
    const t=clamp(this.fadeT/this.fadeDur,0,1);
    const a=this.scenes[this.cur]||fallback,b=this.scenes[this.nxt]||fallback;
    return{
      name:t<.5?a.name:b.name,
      hMin:lerp(a.hMin,b.hMin,t),hMax:lerp(a.hMax,b.hMax,t),
      sLo:lerp(a.sLo,b.sLo,t),sHi:lerp(a.sHi,b.sHi,t),
      lLo:lerp(a.lLo,b.lLo,t),lHi:lerp(a.lHi,b.lHi,t),
      bgH:lerp(a.bgH,b.bgH,t),bgL:lerp(a.bgL,b.bgL,t),speed:lerp(a.speed,b.speed,t),
      layers:this.weights
    };
  }
  getWeight(layer){return this.weights[layer]||0;}
  update(dt,audio,colors){
    this.timer+=dt;
    // Blend weights toward targets
    for(const k of Object.keys(this.targetWeights)){
      this.weights[k]=lerp(this.weights[k]||0,this.targetWeights[k],dt*.8);
    }
    // Early scene change on big bass hit
    const bassForce=audio.bass>.7&&this.timer>8;
    if(this.timer>=this.duration||bassForce){
      if(!this.fading){
        this.fading=true;this.fadeT=0;
        this.nxt=(this.cur+1+Math.floor(Math.random()*(this.scenes.length-1)))%this.scenes.length;
        this._applyScene(this.nxt);
      }
    }
    if(this.fading){
      this.fadeT+=dt;
      if(this.fadeT>=this.fadeDur){
        this.fading=false;this.cur=this.nxt;this.timer=0;this.duration=15+Math.random()*15;
      }
    }
    // Update color system from blended scene
    const sc=this.blendedScene();
    colors.setScene(sc);
  }
  sceneName(){
    if(this.fading){const t=this.fadeT/this.fadeDur;return t<.5?(this.scenes[this.cur]||this.scenes[0]).name:(this.scenes[this.nxt]||this.scenes[0]).name;}
    return (this.scenes[this.cur]||this.scenes[0]).name;
  }
  justTransitioned(){return this.fading&&this.fadeT<1.5;}
}

// JOURNEY CAMERA (NEW)
// ═══════════════════════════════════════════
class JourneyCamera{
  constructor(W,H){
    this.active=false;this.z=0;this.camX=0;this.camY=0;this.roll=0;
    this.pitch=0;this.yaw=0;this.zoom=1;
    this.speed=80;this.fov=400;this.W=W;this.H=H;
    this.driftPhase=Math.random()*TAU;this.rollPhase=Math.random()*TAU;
    this.pitchPhase=Math.random()*TAU;this.yawPhase=Math.random()*TAU;
    this.zoomPhase=Math.random()*TAU;
    // Maneuver system — dramatic angle sweeps
    this.maneuverTimer=0;this.maneuverDur=8+Math.random()*12;
    this.targetRoll=0;this.targetPitch=0;this.targetYaw=0;this.targetZoom=1;
    this._newManeuver();
  }
  resize(W,H){this.W=W;this.H=H;}
  _newManeuver(){
    // Aggressive dramatic viewing angle shifts
    const r=Math.random();
    if(r<.2){// hard banking turn
      this.targetRoll=(Math.random()-.5)*1.2;this.targetPitch=(Math.random()-.5)*.3;this.targetYaw=(Math.random()-.5)*.6;this.targetZoom=1.1+Math.random()*.4;
    }else if(r<.4){// steep dive/climb
      this.targetRoll=(Math.random()-.5)*.3;this.targetPitch=(Math.random()-.5)*.7;this.targetYaw=(Math.random()-.5)*.2;this.targetZoom=.7+Math.random()*.5;
    }else if(r<.55){// aggressive pan
      this.targetRoll=(Math.random()-.5)*.2;this.targetPitch=(Math.random()-.5)*.3;this.targetYaw=(Math.random()-.5)*.9;this.targetZoom=1+Math.random()*.3;
    }else if(r<.7){// zoom rush — intense
      this.targetRoll=(Math.random()-.5)*.15;this.targetPitch=(Math.random()-.5)*.15;this.targetYaw=0;this.targetZoom=1.6+Math.random()*.5;
    }else if(r<.85){// barrel roll
      this.targetRoll=(Math.random()-.5)*1.6;this.targetPitch=(Math.random()-.5)*.35;this.targetYaw=(Math.random()-.5)*.4;this.targetZoom=1.1;
    }else{// brief calm before next storm
      this.targetRoll=(Math.random()-.5)*.1;this.targetPitch=(Math.random()-.5)*.1;this.targetYaw=(Math.random()-.5)*.1;this.targetZoom=1;
    }
    this.maneuverDur=3+Math.random()*8; // shorter, more frequent
  }
  update(dt,audio){
    if(!this.active)return;
    const speedMod=80+180*(.5+audio.bass*.7);
    this.speed=lerp(this.speed,speedMod,dt*.6);
    this.z+=this.speed*dt;
    // Smooth drift
    this.driftPhase+=dt*.5;this.rollPhase+=dt*.3;
    this.pitchPhase+=dt*.17;this.yawPhase+=dt*.13;this.zoomPhase+=dt*.09;
    this.camX=Math.sin(this.driftPhase)*150+Math.sin(this.driftPhase*.37)*80;
    this.camY=Math.cos(this.driftPhase*.7)*100+Math.sin(this.driftPhase*.23)*60;
    // Maneuver transitions
    this.maneuverTimer+=dt;
    if(this.maneuverTimer>=this.maneuverDur||(audio.bass>.55&&this.maneuverTimer>2.5)){
      this.maneuverTimer=0;this._newManeuver();
    }
    const lerpRate=dt*.7;
    // Organic oscillation layered on top of maneuver targets
    const oscRoll=Math.sin(this.rollPhase)*.06+Math.sin(this.rollPhase*2.3)*.03;
    const oscPitch=Math.sin(this.pitchPhase)*.05+Math.sin(this.pitchPhase*1.7)*.03;
    const oscYaw=Math.sin(this.yawPhase)*.04+Math.sin(this.yawPhase*2.1)*.02;
    const oscZoom=Math.sin(this.zoomPhase)*.05+audio.bass*.08;
    this.roll=lerp(this.roll,this.targetRoll+oscRoll,lerpRate);
    this.pitch=lerp(this.pitch,this.targetPitch+oscPitch,lerpRate);
    this.yaw=lerp(this.yaw,this.targetYaw+oscYaw,lerpRate);
    this.zoom=lerp(this.zoom,this.targetZoom+oscZoom,lerpRate);
  }
  project(wx,wy,wz){
    const depth=wz-this.z;
    if(depth<10)return null;
    const s=this.fov/depth;
    const rx=wx-this.camX,ry=wy-this.camY;
    const cr=Math.cos(this.roll),sr=Math.sin(this.roll);
    const px=rx*cr-ry*sr,py=rx*sr+ry*cr;
    return{x:this.W/2+px*s,y:this.H/2+py*s,s:Math.min(s,4)};
  }
  // Apply 2D canvas transforms for all non-particle content
  applyCanvasTransform(ctx,W,H){
    ctx.translate(W/2,H/2);
    ctx.rotate(this.roll);
    ctx.scale(this.zoom,this.zoom);
    // pitch = vertical shift, yaw = horizontal shift (simulated via translate)
    ctx.translate(this.yaw*W*.6, this.pitch*H*.6);
    ctx.translate(-W/2,-H/2);
  }
  worldZ(ahead){return this.z+ahead;}
  respawnZ(){return this.z+800+Math.random()*1200;}
}

class ModeSelectScreen{
  constructor(){
    this.done=false;this.mode=null;
    this.previewStationary=document.getElementById('preview-stationary');
    this.previewJourney=document.getElementById('preview-journey');
    this.ctxS=this.previewStationary.getContext('2d');
    this.ctxJ=this.previewJourney.getContext('2d');
    this._resizePreviews();
    this.animId=null;this.t=0;
    this._startPreviews();
  }
  _resizePreviews(){
    const rect=this.previewStationary.parentElement;
    const w=220,h=260;
    this.previewStationary.width=w;this.previewStationary.height=h;
    this.previewJourney.width=w;this.previewJourney.height=h;
    this.pw=w;this.ph=h;
  }
  _startPreviews(){
    const loop=()=>{
      this.animId=requestAnimationFrame(loop);
      this.t=performance.now()/1000;
      this._drawStationary();
      this._drawJourney();
    };
    loop();
  }
  _drawStationary(){
    const ctx=this.ctxS,w=this.pw,h=this.ph,t=this.t,cx=w/2,cy=h/2;
    ctx.fillStyle='rgba(5,0,18,.3)';ctx.fillRect(0,0,w,h);
    // Pulsing sacred geometry rings
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let ring=0;ring<5;ring++){
      const r=(20+ring*22)*(1+.08*Math.sin(t*1.2+ring*.8));
      const hue=(t*40+ring*50)%360;
      ctx.strokeStyle=`hsla(${hue|0},92%,65%,${.4+.2*Math.sin(t+ring)})`;ctx.lineWidth=1.5;
      ctx.beginPath();
      const sides=6;
      for(let i=0;i<=sides;i++){const a=i*TAU/sides+t*.2*(ring%2?1:-1);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
      ctx.closePath();ctx.stroke();
    }
    // Central glow
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,40);
    const hue2=(t*60)%360;
    g.addColorStop(0,`hsla(${hue2|0},95%,70%,.4)`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,40,0,TAU);ctx.fill();
    ctx.restore();
  }
  _drawJourney(){
    const ctx=this.ctxJ,w=this.pw,h=this.ph,t=this.t,cx=w/2,cy=h/2;
    ctx.fillStyle='rgba(0,2,12,.25)';ctx.fillRect(0,0,w,h);
    // Rushing starfield/tunnel
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<60;i++){
      const angle=(i/60)*TAU+t*.3,baseR=5+((t*80+i*14)%120);
      const r=baseR;
      const px=cx+Math.cos(angle)*r,py=cy+Math.sin(angle)*r;
      const sz=.5+2*(r/120);
      const a=.1+.5*(r/120);
      const hue=(t*50+i*6)%360;
      ctx.fillStyle=`hsla(${hue|0},95%,70%,${a.toFixed(2)})`;
      ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();
    }
    // Tunnel rings rushing outward
    for(let ring=0;ring<6;ring++){
      const r=((t*60+ring*25)%120);
      const a=.5*(1-r/120);
      const hue=(t*30+ring*40)%360;
      if(a>.01){ctx.strokeStyle=`hsla(${hue|0},90%,65%,${a.toFixed(2)})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();}
    }
    ctx.restore();
  }
  stopPreviews(){if(this.animId){cancelAnimationFrame(this.animId);this.animId=null;}}
  select(mode){this.mode=mode;this.done=true;this.stopPreviews();}
  get isDone(){return this.done;}
}

// ═══════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════
class App{
  constructor(){
    this.canvas=document.getElementById('c');this.ctx=this.canvas.getContext('2d');
    this.entry=document.getElementById('entry');this.hud=document.getElementById('hud');
    this.phaseLabel=document.getElementById('phase-label');
    this.started=false;this.time=0;this.lastTime=0;this.W=0;this.H=0;
    this.mx=0;this.my=0;this.pmx=0;this.pmy=0;this.vel=0;
    this.down=false;this.holdDur=0;this.idleTime=0;this.lastRipple=0;this.flashA=0;
    this.journeyMode=false;
    this.layers={rd:true,attractor:true,geometry:true,lissajous:true,fourier:true,particles:true,tunnel:true,collatz:true,gol:true};
    this.userOverrides=new Set();
    this.breath=new BreathingSystem();this.timeSys=new TimeSystem();
    this.colors=new ColorSystem();this.mic=new MicrophoneSystem();
    this.particles=new ParticlePool(2000);this.ripples=new RippleSystem();
    this.trail=new TrailSystem(100);this.rd=new ReactionDiffusion();
    this.attractor=new StrangeAttractor();this.lissajous=new LissajousSystem();
    this.fourier=new FourierMandala();this.geometry=new GeometryEngine();
    this.tunnel=new TunnelEffect();this.spirits=new SpiritLights();this.sound=new SoundEngine();
    this.collatz=new CollatzTree();this.gol=new GameOfLife();
    this.director=new SceneDirector();
    this.camera=null;
    this.modeSelect=new ModeSelectScreen();
    this.ambientSpawned=false;this.micEnabled=true;
    this.lastSceneName='';this.entryTime=0;
    this._setupHud();this._setupEvents();this.resize();
    window.addEventListener('resize',()=>this.resize());
  }

  _setupHud(){
    this.hud.querySelectorAll('.hud-btn').forEach(btn=>{
      const layer=btn.dataset.layer;
      btn.classList.toggle('on',!!this.layers[layer]);
      btn.classList.toggle('off',!this.layers[layer]);
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        this.layers[layer]=!this.layers[layer];
        btn.classList.toggle('on',this.layers[layer]);
        btn.classList.toggle('off',!this.layers[layer]);
        this.userOverrides.add(layer);
      });
    });
  }

  _setupEvents(){
    this.muted=false;
    // Entry mic button
    document.getElementById('mic-btn').addEventListener('click',e=>{
      e.stopPropagation();this.micEnabled=!this.micEnabled;
      const btn=document.getElementById('mic-btn');
      btn.classList.toggle('active',this.micEnabled);
      btn.textContent=this.micEnabled?'🎤 Microphone On':'🎤 Microphone Off';
    });
    // In-experience control buttons
    document.getElementById('btn-mic').addEventListener('click',e=>{
      e.stopPropagation();this.micEnabled=!this.micEnabled;
      document.getElementById('btn-mic').classList.toggle('active',this.micEnabled);
      if(this.micEnabled&&this.sound.ok&&!this.mic.active)this.mic.init(this.sound.audioCtx);
    });
    document.getElementById('btn-mute').addEventListener('click',e=>{
      e.stopPropagation();this.muted=!this.muted;
      const btn=document.getElementById('btn-mute');
      btn.textContent=this.muted?'🔇':'🔊';
      if(this.sound.ok)this.sound.master.gain.setTargetAtTime(this.muted?0:.5,this.sound.ctx.currentTime,.1);
    });
    document.getElementById('btn-fs').addEventListener('click',e=>{
      e.stopPropagation();
      const el=document.documentElement;
      if(!document.fullscreenElement&&!document.webkitFullscreenElement){
        (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||function(){}).call(el);
      }else{
        (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen||function(){}).call(document);
      }
    });
    document.getElementById('btn-home').addEventListener('click',e=>{
      e.stopPropagation();this._goHome();
    });
    // Mode selection panels
    document.getElementById('panel-stationary').addEventListener('click',e=>{e.stopPropagation();this._startExperience(false);});
    document.getElementById('panel-journey').addEventListener('click',e=>{e.stopPropagation();this._startExperience(true);});
    window.addEventListener('mousemove',e=>{
      this.pmx=this.mx;this.pmy=this.my;this.mx=e.clientX;this.my=e.clientY;
      const dx=this.mx-this.pmx,dy=this.my-this.pmy;this.vel=Math.sqrt(dx*dx+dy*dy);this.idleTime=0;
      if(this.spirits.active)this.spirits.fadeAll();
    });
    window.addEventListener('mousedown',e=>{
      if(!this.started||!this.modeSelect.isDone)return;
      this.down=true;this.holdDur=0;this._onClick(e.clientX,e.clientY);
    });
    window.addEventListener('mouseup',()=>{if(this.down&&this.holdDur>.3)this._onRelease();this.down=false;this.holdDur=0;this.sound.releaseHold();});
    window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];this.pmx=this.mx;this.pmy=this.my;this.mx=t.clientX;this.my=t.clientY;const dx=this.mx-this.pmx,dy=this.my-this.pmy;this.vel=Math.sqrt(dx*dx+dy*dy);this.idleTime=0;if(this.spirits.active)this.spirits.fadeAll();},{passive:false});
    window.addEventListener('touchstart',e=>{
      // iOS/mobile: resume AudioContext on any touch (may suspend after screen lock etc.)
      if(this.sound.ok&&this.sound.ctx.state==='suspended')this.sound.ctx.resume();
      if(!this.started||!this.modeSelect.isDone)return;const t=e.touches[0];this.mx=t.clientX;this.my=t.clientY;this.down=true;this.holdDur=0;this._onClick(this.mx,this.my);
    });
    window.addEventListener('touchend',()=>{if(this.down&&this.holdDur>.3)this._onRelease();this.down=false;this.holdDur=0;this.sound.releaseHold();});
    let hudTimer=null;const ctrlEl=document.getElementById('controls');
    window.addEventListener('mousemove',()=>{
      if(!this.started||!this.modeSelect.isDone)return;
      if(performance.now()/1000-this.entryTime<2)return;
      this.hud.classList.add('visible');ctrlEl.classList.add('visible');clearTimeout(hudTimer);
      hudTimer=setTimeout(()=>{this.hud.classList.remove('visible');ctrlEl.classList.remove('visible');},4000);
    });
    // Touch: show controls on tap
    window.addEventListener('touchstart',()=>{
      if(!this.started||!this.modeSelect.isDone)return;
      ctrlEl.classList.add('visible');this.hud.classList.add('visible');clearTimeout(hudTimer);
      hudTimer=setTimeout(()=>{this.hud.classList.remove('visible');ctrlEl.classList.remove('visible');},4000);
    },{passive:true});
  }

  _startExperience(isJourney){
    this.journeyMode=isJourney;
    this.modeSelect.select(isJourney?'journey':'stationary');
    this.entry.classList.add('hidden');
    this.sound.init();
    // Restore sound volume (may have been faded by _goHome)
    if(this.sound.ok&&!this.muted){
      this.sound.master.gain.setTargetAtTime(.5,this.sound.ctx.currentTime,.1);
      this.sound.droneGain.gain.setTargetAtTime(.07,this.sound.ctx.currentTime,.1);
    }
    if(this.sound.ok&&this.sound.ctx.state==='suspended')this.sound.ctx.resume();
    if(this.micEnabled&&!this.mic.active)this.mic.init(this.sound.audioCtx);
    if(isJourney){this.camera=new JourneyCamera(this.W,this.H);this.camera.active=true;}
    this.started=true;this.lastTime=performance.now()/1000;this.entryTime=this.lastTime;
    this.mx=this.W/2;this.my=this.H/2;
    this.fourier.setSym(8);
    // Auto-fullscreen on mobile
    const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if(isMobile){
      const el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||function(){}).call(el);
    }
    if(!this._looping){this._looping=true;requestAnimationFrame(t=>this._loop(t));}
  }

  _goHome(){
    // Return to entry screen
    this.started=false;
    this.entry.classList.remove('hidden');
    this.modeSelect.isDone=false;
    // Stop sound gracefully
    if(this.sound.ok){
      this.sound.master.gain.setTargetAtTime(0,this.sound.ctx.currentTime,.3);
      this.sound.droneGain.gain.setTargetAtTime(0,this.sound.ctx.currentTime,.3);
      if(this.sound.ambMaster)this.sound.ambMaster.gain.setTargetAtTime(0,this.sound.ctx.currentTime,.3);
    }
    // Hide controls immediately and prevent re-show
    const ctrlEl=document.getElementById('controls');
    ctrlEl.classList.remove('visible');
    this.hud.classList.remove('visible');
    // Force hide with slight delay to override any pending touchstart show
    setTimeout(()=>{ctrlEl.classList.remove('visible');this.hud.classList.remove('visible');},50);
    // Exit fullscreen
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen||function(){}).call(document);
    }
  }

  _onClick(x,y){
    const h=this.colors.hslValues().h;
    for(let i=0;i<80;i++){const a=Math.random()*TAU,s=2+Math.random()*6;this.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,1+Math.random()*1.5,2+Math.random()*3,h+Math.random()*40-20,2);}
    this.ripples.spawn(x,y,h);this.flashA=.15;this.geometry.pulse();
    this.sound.triggerClick(x/this.W,y/this.H);this.sound.startHold();
    for(let i=0;i<this.particles.count;i++){if(this.particles.type[i]!==0)continue;const dx=this.particles.x[i]-x,dy=this.particles.y[i]-y,dist=Math.sqrt(dx*dx+dy*dy)+1;if(dist<300){const f=(300-dist)/300*3;this.particles.vx[i]+=dx/dist*f;this.particles.vy[i]+=dy/dist*f;}}
  }
  _onRelease(){const h=this.colors.hslValues().h;for(let i=0;i<30;i++){const a=Math.random()*TAU,s=1+Math.random()*4;this.particles.spawn(this.mx,this.my,Math.cos(a)*s,Math.sin(a)*s,.8+Math.random(),1.5+Math.random()*2,h+60+Math.random()*30,3);}}

  resize(){
    const dpr=window.devicePixelRatio||1;this.W=window.innerWidth;this.H=window.innerHeight;
    this.canvas.width=this.W*dpr;this.canvas.height=this.H*dpr;
    this.canvas.style.width=this.W+'px';this.canvas.style.height=this.H+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    if(this.camera)this.camera.resize(this.W,this.H);
  }

  _spawnAmbient(){
    if(this.ambientSpawned)return;this.ambientSpawned=true;
    const camZ=this.camera?this.camera.z:0;
    for(let i=0;i<300;i++){
      const z=this.camera?camZ+Math.random()*2000:0;
      this.particles.spawn(
        (Math.random()-.5)*this.W*3+this.W/2,
        (Math.random()-.5)*this.H*3+this.H/2,
        (Math.random()-.5)*.5,(Math.random()-.5)*.5,
        9999,1+Math.random()*2,Math.random()*360,0,z,0);
    }
  }
  _respawnJourneyParticles(){
    if(!this.camera||!this.camera.active)return;
    let ahead=0;
    for(let i=0;i<this.particles.count;i++){
      if(this.particles.z[i]-this.camera.z>50)ahead++;
    }
    if(ahead<100){
      for(let i=0;i<8;i++){
        const z=this.camera.respawnZ();
        this.particles.spawn(
          (Math.random()-.5)*this.W*4+this.W/2,
          (Math.random()-.5)*this.H*4+this.H/2,
          (Math.random()-.5)*.3,(Math.random()-.5)*.3,
          30+Math.random()*30,1.5+Math.random()*3,Math.random()*360,4,z,0);
      }
    }
  }

  _loop(ts){
    requestAnimationFrame(t=>this._loop(t));
    try{
      const now=ts/1000,dt=clamp(now-this.lastTime,0,.05);
      if(!isFinite(dt)||dt<=0){this.lastTime=now;return;}
      this.lastTime=now;this.time+=dt;this.idleTime+=dt;
      this.timeSys.update();this.breath.update(dt);
      if(this.mic.active)this.mic.update();else this.mic.fallback(this.time);
      const audio=this.mic;

      this._spawnAmbient();
      this._respawnJourneyParticles();
      this.director.update(dt,audio,this.colors);
      this.colors.update(dt,this.timeSys);

      // Show scene name on transitions
      const sn=this.director.sceneName();
      if(sn!==this.lastSceneName){
        this.lastSceneName=sn;
        this.phaseLabel.textContent=sn.toUpperCase();
        this.phaseLabel.classList.add('visible');
        setTimeout(()=>this.phaseLabel.classList.remove('visible'),3000);
      }

      if(this.camera)this.camera.update(dt,audio);
      this.trail.update(dt);this.particles.update(dt,this.mx,this.my);
      this.ripples.update(dt);
      this.geometry.update(dt,this.breath,this.W,this.H,this.down,this.mx,this.my,this.timeSys);
      this.attractor.update(dt);this.lissajous.update(dt,audio);
      this.fourier.update(dt);this.rd.update(audio.bass);
      if(this._layerActive('tunnel'))this.tunnel.update(dt,audio,this.breath,this.timeSys);
      if(this._layerActive('collatz'))this.collatz.update(dt,audio);
      if(this._layerActive('gol'))this.gol.update(dt,audio);
      this.spirits.update(dt);this.sound.updateDrone(this.time);this.sound.updateAmbient(this.time,audio);

      if(this.vel>.5){
        this.trail.push(this.mx,this.my);
        if(this.vel>2){const n=Math.min(3,this.vel/8|0),h=this.colors.hslValues(this.vel*2).h;for(let i=0;i<n;i++)this.particles.spawn(this.mx+(Math.random()-.5)*10,this.my+(Math.random()-.5)*10,(Math.random()-.5)*1.5,(Math.random()-.5)*1.5,.5+Math.random()*.8,1+Math.random()*1.5,h+Math.random()*20,1);}
        if(this.time-this.lastRipple>.1){this.ripples.spawn(this.mx,this.my,this.colors.hslValues().h);this.lastRipple=this.time;}
        this.sound.updateMove(this.mx/this.W,this.my/this.H,this.vel);
      }else{this.sound.fadeMove();}

      if(this.down){this.holdDur+=dt;this.sound.updateHold(this.holdDur);if(this.holdDur>.2){for(let i=0;i<8;i++){const a=this.time*5+i*TAU/8,s=2+Math.random()*2,h=this.colors.hslValues(this.holdDur*30).h;this.particles.spawn(this.mx,this.my,Math.cos(a)*s,Math.sin(a)*s,.6+Math.random()*.6,1.5+Math.random(),h,3);}if(this.holdDur>.5&&this._layerActive('tunnel')){this.tunnel.boostFromHold();if(!this.tunnel.active)this.tunnel.trigger(3+this.holdDur);}}}
      if(audio.bass>.55&&Math.random()<audio.bass*dt*8){const h=this.colors.hslValues(audio.bass*80).h;for(let i=0;i<3;i++)this.particles.spawn(Math.random()*this.W,Math.random()*this.H,(Math.random()-.5)*2,(Math.random()-.5)*2,2+Math.random()*2,1.5+Math.random()*2,h+Math.random()*30,1);}
      if(this.idleTime>10&&Math.random()<dt*.3)this.spirits.spawn(this.W,this.H,this.colors.hslValues(Math.random()*60).h);
      if(this.flashA>0)this.flashA*=.88;this.vel*=.85;
      this._renderMain(audio);
    }catch(e){console.error('LOOP ERR:',e.message,e.stack);}
  }

  _layerActive(name){
    if(this.userOverrides.has(name))return this.layers[name]?1:0;
    const w=this.director.getWeight(name);
    if(w<.02||!this.layers[name])return 0;
    return w; // return weight for alpha-based fading
  }

  _renderMain(audio){
    const ctx=this.ctx,{W,H}=this,bg=this.breath.value;
    const sc=this.director.blendedScene();
    const bgH=((sc.bgH+this.timeSys.hueShift)+360)%360;

    // Background — vibrant
    const audioPulse=audio.bass*.4+audio.volume*.15;
    const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*(.6+bg*.15+audioPulse*.1));
    grad.addColorStop(0,`hsla(${bgH|0},${50+audio.bass*25|0}%,${sc.bgL+bg*5+audioPulse*7}%,1)`);
    grad.addColorStop(.5,`hsla(${(bgH+30)|0},40%,${sc.bgL*.7+bg*3+audioPulse*4}%,1)`);
    grad.addColorStop(1,`hsla(${(bgH+60)|0},25%,${3+audioPulse*3}%,1)`);
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

    const cam=this.camera&&this.camera.active?this.camera:null;

    // === Journey mode: apply sweeping camera transform to all content ===
    if(cam){ctx.save();cam.applyCanvasTransform(ctx,W,H);}

    // Each layer uses weight as globalAlpha for smooth fade transitions
    let w;

    w=this._layerActive('rd');
    if(w){ctx.save();ctx.globalAlpha=w;this.rd.draw(ctx,W,H,this.colors,.6+audio.bass*.2);ctx.restore();}

    w=this._layerActive('attractor');
    if(w){ctx.save();ctx.globalAlpha=w;this.attractor.draw(ctx,W,H,this.colors,audio);ctx.restore();}

    w=this._layerActive('collatz');
    if(w){ctx.save();ctx.globalAlpha=w;this.collatz.draw(ctx,W,H,this.colors,audio);ctx.restore();}

    w=this._layerActive('gol');
    if(w){ctx.save();ctx.globalAlpha=w;this.gol.draw(ctx,W,H,this.colors);ctx.restore();}

    w=this._layerActive('geometry');
    if(w){ctx.save();ctx.globalAlpha=w;const aScale=1+audio.bass*.08+audio.volume*.04;ctx.translate(W/2,H/2);ctx.scale(aScale,aScale);ctx.translate(-W/2,-H/2);this.geometry.draw(ctx,W,H,this.colors,this.breath);ctx.restore();}

    w=this._layerActive('lissajous');
    if(w){ctx.save();ctx.globalAlpha=w;this.lissajous.draw(ctx,W/2,H/2,Math.min(W,H)*.22*this.breath.scale,this.colors,audio);ctx.restore();}

    w=this._layerActive('fourier');
    if(w){ctx.save();ctx.globalAlpha=w;this.fourier.draw(ctx,W/2,H/2,Math.min(W,H)*.28,this.colors,audio);ctx.restore();}

    w=this._layerActive('tunnel');
    if(w){ctx.save();ctx.globalAlpha=w;this.tunnel.draw(ctx,W,H,this.colors,audio);ctx.restore();}

    // Trail
    this.trail.draw(ctx,this.colors);

    // Ripples
    this.ripples.draw(ctx);

    // Particles
    if(this._layerActive('particles'))this.particles.draw(ctx,cam);

    // Spirit lights
    this.spirits.draw(ctx);

    // === End journey camera transform ===
    if(cam)ctx.restore();

    // Flash
    const bassPulseA=Math.max(0,audio.bass-.5)*.35;
    const totalFlash=Math.max(this.flashA,bassPulseA);
    if(totalFlash>.005){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=`hsla(${this.colors.hslValues().h|0},80%,80%,${totalFlash.toFixed(3)})`;ctx.fillRect(0,0,W,H);ctx.restore();}

    // Vignette — reduced alpha for vibrancy
    const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.8);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.15)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

    // Subtle mic indicator
    this.mic.drawIndicator(ctx,W,H);
  }
}
